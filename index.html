<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laboratoire virtuel SVT, 1re Bac Sciences expérimentales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--disp:'Bricolage Grotesque','Atkinson Hyperlegible',system-ui,sans-serif;--fs:17px;
--bg:#EEF2F0;--surface:#FFFFFF;--ink:#15262A;--muted:#566A6C;--line:#D2DCD8;--soft:#E3EBE7;
--u1:#9C5A16;--u2:#1D7447;--u3:#4541A0;--onu:#FFFFFF;--hot:#B83227;
--g1:#EAD9B0;--g2:#D6B98A;--g3:#B98E5F;--g4:#BFCDD0;--g5:#EFEBDD;--water:#D3E8EF;--turb:#B79B72;--dark:#3B4046;--sol:#DCCFEE;--antho:#9C2A6B;--rbc:#C94A45;--rbcl:#E5938C;--guard:#BFE0B8;--cell:#F3F6EE;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181A;--surface:#182226;--ink:#E4ECEA;--muted:#9BAFAD;--line:#2D3B3F;--soft:#213035;--u1:#E39B55;--u2:#5DC08B;--u3:#A09DF2;--onu:#0E1618;--hot:#FF8A7A;--g1:#8A7650;--g2:#7A6245;--g3:#654C35;--g4:#50626A;--g5:#77746A;--water:#1E3A46;--turb:#8C7550;--dark:#B7BEC3;--sol:#4A3F66;--antho:#D0569B;--rbc:#D9635E;--rbcl:#8E3A36;--guard:#3F6B45;--cell:#1F2B2F}}
:root[data-theme="dark"]{--bg:#10181A;--surface:#182226;--ink:#E4ECEA;--muted:#9BAFAD;--line:#2D3B3F;--soft:#213035;--u1:#E39B55;--u2:#5DC08B;--u3:#A09DF2;--onu:#0E1618;--hot:#FF8A7A;--g1:#8A7650;--g2:#7A6245;--g3:#654C35;--g4:#50626A;--g5:#77746A;--water:#1E3A46;--turb:#8C7550;--dark:#B7BEC3;--sol:#4A3F66;--antho:#D0569B;--rbc:#D9635E;--rbcl:#8E3A36;--guard:#3F6B45;--cell:#1F2B2F}
html{font-size:var(--fs);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
html.big{--fs:21px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--u3);outline-offset:2px}
.top{display:flex;align-items:center;gap:10px 14px;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.brand{margin-right:auto;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;font-family:var(--disp);font-weight:700;font-size:1.15rem;line-height:1.2}
.brand small{display:block;font-family:var(--body);font-weight:400;font-size:.78rem;color:var(--muted)}
.tb{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:.88rem;cursor:pointer}
.tb[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.menu{display:none}
.wrap{display:grid;grid-template-columns:300px minmax(0,1fr)}
aside{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:100dvh;overflow:auto;padding:14px 12px 40px}
aside input{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:.92rem}
.keyl{font-size:.78rem;color:var(--muted);margin:8px 6px 0;display:flex;gap:14px;flex-wrap:wrap}
.keyl span{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--u2);display:inline-block;flex:none}
.dot.st{background:none;border:1.5px solid var(--u2)}
.uh{font-family:var(--disp);font-weight:700;font-size:.95rem;line-height:1.25;margin:20px 6px 4px;padding-left:10px;border-left:4px solid var(--uc)}
.uh span{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted)}
.ch{font-size:.8rem;color:var(--muted);margin:12px 6px 2px 14px;font-style:italic}
.it{display:flex;gap:9px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px 6px 14px;font-size:.88rem;line-height:1.35;cursor:pointer}
.it:hover{background:var(--soft)}
.it[aria-current]{background:var(--soft);box-shadow:inset 3px 0 var(--uc);font-weight:700}
.it .dot{background:var(--uc);margin-top:.35em}.it .dot.st{background:none;border-color:var(--uc)}
main{padding:26px clamp(16px,3vw,44px) 70px;min-width:0;max-width:1240px}
.crumb{font-size:.88rem;color:var(--uc);font-weight:700;margin:0}
h1{font-family:var(--disp);font-weight:700;font-size:clamp(1.55rem,3.2vw,2.35rem);line-height:1.12;margin:.25em 0 .45em;max-width:32ch;letter-spacing:-.01em}
h2{font-family:var(--disp);font-weight:700;font-size:1.15rem;margin:0 0 .45em}
h3{font-size:1rem;margin:.9em 0 .3em}
.obj{max-width:72ch;font-size:1.05rem;margin:0}
.lay{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);margin-top:20px}
.proto p,.proto li{max-width:72ch}
.proto ol{padding-left:1.4em;margin:0}.proto li{margin:.4em 0}
.note{font-size:.88rem;color:var(--muted)}
.bench{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--uc);border-radius:10px;padding:16px 16px 18px;container-type:inline-size;min-width:0}
.ctl{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:flex-end;margin-bottom:12px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{font-size:.88rem;padding:7px 12px;border:0;border-right:1px solid var(--line);background:var(--surface);cursor:pointer}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--uc);color:var(--onu);font-weight:700}
.b{font-size:.9rem;padding:8px 14px;border-radius:8px;border:1px solid var(--uc);background:var(--uc);color:var(--onu);cursor:pointer;font-weight:700}
.b.ghost{background:transparent;color:var(--ink);border-color:var(--line);font-weight:400}
.sl{display:flex;flex-direction:column;gap:2px;font-size:.88rem;min-width:170px;flex:1}
.sl input{accent-color:var(--uc);width:100%}
.ck{font-size:.88rem;display:inline-flex;gap:6px;align-items:center;margin-right:10px}
.ck input{accent-color:var(--uc);width:18px;height:18px}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@container (min-width:620px){.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.pic,.plot{width:100%;height:auto;display:block}
svg text{font-family:var(--body);font-size:13px;fill:var(--muted)}
.pw{max-width:760px}
.plot .al{fill:var(--ink);font-weight:700;font-size:12.5px}
.grid{stroke:var(--line);stroke-width:1}.axis{stroke:var(--ink);stroke-width:1.3}
.ref{stroke:var(--muted);stroke-dasharray:3 4}.band{fill:var(--ink);opacity:.08}
.ser{fill:none;stroke-linejoin:round;stroke-linecap:round}.mk{fill:var(--surface);stroke:var(--ink);stroke-width:2}
.mkl{fill:var(--ink);font-weight:700}
.fg1{fill:var(--g1)}.fg2{fill:var(--g2)}.fg3{fill:var(--g3)}.fg4{fill:var(--g4)}.fg5{fill:var(--g5)}
.fmut{fill:var(--muted)}.fink{fill:var(--ink)}.fdark{fill:var(--dark)}.fwater{fill:var(--water)}.fsurf{fill:var(--surface)}
.fsol{fill:var(--sol)}.fcell{fill:var(--cell)}.fguard{fill:var(--guard)}.fhot{fill:var(--hot)}
.glass{fill:none;stroke:var(--ink);stroke-width:2}.turb{fill:var(--turb)}.shine{fill:#fff;opacity:.75}
.sk{stroke:var(--ink);stroke-width:1}.nof{fill:none}.cut{stroke:var(--hot);stroke-width:3.5;fill:none}
.lab{fill:var(--ink);font-weight:700;font-size:14px;paint-order:stroke;stroke:var(--surface);stroke-width:4px}
.lnk{stroke:var(--muted);stroke-width:1;fill:none}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.out{margin-top:12px;padding:10px 14px;background:var(--soft);border-radius:8px;font-size:.95rem}
.out p{margin:.3em 0}
.t{border-collapse:collapse;width:100%;font-size:.9rem;margin:.4em 0}
.t th,.t td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.t th{background:var(--soft)}
.t input{width:5.5em;padding:3px 6px;border:1px solid var(--line);border-radius:4px;background:var(--bg)}
.t tr.on td{background:var(--soft);font-weight:700}
.scroll{overflow-x:auto}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 14px;font-size:.86rem;margin-bottom:10px}
.grid4 label{display:flex;flex-direction:column;gap:3px}
.grid4 input,.grid4 select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.sol h3{margin:0 0 6px}.sol{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:minmax(8em,12em) 1fr 3.5em;gap:8px;align-items:center;margin:7px 0;font-size:.88rem}
.bar div{height:14px;background:var(--soft);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--uc)}
.lbl{font-weight:700;font-size:.9rem;margin:.2em 0 .4em}
.leg{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;margin-top:4px}
.leg i{display:inline-block;width:18px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.eq{background:var(--surface);border:1px solid var(--line);padding:2px 8px;border-radius:5px;display:inline-block;margin:4px 0}
.rx{font-size:1.15rem;line-height:2;padding:8px 0}
.hot{color:var(--hot);font-weight:700}
.reveal{margin-top:14px}
.rv{display:flex;width:100%;justify-content:space-between;align-items:center;font-family:var(--disp);font-weight:700;font-size:1.05rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px;cursor:pointer;text-align:left}
.rv::after{content:'+';font-size:1.4rem;line-height:1;color:var(--uc)}
.rv[aria-expanded="true"]{border-radius:10px 10px 0 0}
.rv[aria-expanded="true"]::after{content:'\2212'}
.rvb{padding:12px 16px;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;background:var(--surface)}
.rvb p{max-width:75ch;margin:.3em 0}
.qs{margin-top:26px}.qs ol{padding-left:1.4em}.qs li{margin:.35em 0;max-width:72ch}
.pn{display:flex;justify-content:space-between;gap:12px;margin-top:30px;border-top:1px solid var(--line);padding-top:16px}
.pn a{text-decoration:none;color:var(--ink)}.pn .b{max-width:48%;text-align:left}.pn .b span{display:block;font-size:.78rem;color:var(--muted)}
.hero{padding:10px 0 18px;border-bottom:1px solid var(--line)}
.hero h1{font-size:clamp(2rem,5vw,3.4rem);max-width:18ch;margin-bottom:.3em}
.lead{font-size:1.12rem;max-width:62ch;margin:0 0 .8em}
.meta{color:var(--muted);font-size:.92rem;margin:0}
.units{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-top:26px}
.unit{border-top:5px solid var(--uc);padding-top:10px}
.unit h2{margin:0;color:var(--uc)}.unit .un{margin:.1em 0 .4em;font-weight:700}
.unit h3{font-size:.9rem;color:var(--muted);font-style:italic;font-weight:400;margin:1em 0 .2em}
.unit ul{list-style:none;padding:0;margin:0}.unit li{margin:.25em 0;display:flex;gap:8px;align-items:baseline}
.unit li .dot{background:var(--uc)}.unit li .dot.st{background:none;border-color:var(--uc)}
.unit a{color:var(--ink);text-decoration-color:var(--line);text-underline-offset:3px}
.unit a:hover{text-decoration-color:var(--uc)}
.how{margin-top:34px;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;max-width:80ch}
.how p{margin:.3em 0}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.menu{display:inline-block}
aside{position:fixed;top:0;bottom:0;left:0;width:min(86vw,340px);max-height:none;z-index:30;transform:translateX(-105%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
aside.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25}}
@media (prefers-reduced-motion:reduce){aside{transition:none}}
</style>
</head>
<body>
<header class="top">
<button class="tb menu" id="menu" aria-expanded="false" aria-controls="side">Expériences</button>
<button class="brand" id="home">Laboratoire virtuel de SVT<small>1re année Bac Sciences expérimentales, Pr. EL Hassouni Mohamed</small></button>
<button class="tb" id="big" aria-pressed="false">Grand écran</button>
<button class="tb" id="theme">Thème sombre</button>
</header>
<div class="wrap">
<aside id="side" aria-label="Liste des expériences">
<input type="search" id="q" placeholder="Rechercher une expérience" aria-label="Rechercher une expérience">
<p class="keyl"><span><i class="dot"></i>simulation interactive</span><span><i class="dot st"></i>étude de documents</span></p>
<nav id="nav"></nav>
</aside>
<main id="main"></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<script>
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let cleanups=[];
const later=f=>cleanups.push(f);
function cleanup(){cleanups.forEach(f=>{try{f()}catch(e){}});cleanups=[]}
const fmt=(x,d=2)=>Number(x).toFixed(d).replace('.',',');
const fmtn=x=>String(x).replace('.',',');
function rng(s){return()=>(s=s*16807%2147483647)/2147483647}
function seg(n,opts,v){return `<div class="seg" role="group" data-n="${n}">${opts.map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${k==v}">${l}</button>`).join('')}</div>`}
function onSeg(r,n,cb){const g=r.querySelector(`.seg[data-n="${n}"]`);g.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;g.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));cb(b.dataset.v)})}
function sl(n,l,mn,mx,st,v,u=''){return `<label class="sl"><span>${l} <b data-o="${n}">${fmtn(v)}</b> ${u}</span><input type="range" data-n="${n}" min="${mn}" max="${mx}" step="${st}" value="${v}"></label>`}
function onSl(r,n,cb){const i=r.querySelector(`input[data-n="${n}"]`),o=r.querySelector(`[data-o="${n}"]`);i.addEventListener('input',()=>{o.textContent=fmtn(i.value);cb(+i.value)});return i}
function btn(n,l,c=''){return `<button type="button" class="b ${c}" data-b="${n}">${l}</button>`}
function onBtn(r,n,cb){r.querySelector(`[data-b="${n}"]`).addEventListener('click',cb)}
const q=(r,s)=>r.querySelector(s);
function plot(o){
 const W=o.w||520,H=o.h||300,m={l:58,r:16,t:18,b:50},lg=Math.log10;
 const tx=x=>o.xlog?(lg(x)-lg(o.x0))/(lg(o.x1)-lg(o.x0)):(x-o.x0)/(o.x1-o.x0);
 const X=x=>m.l+tx(x)*(W-m.l-m.r),Y=y=>H-m.b-(y-o.y0)/(o.y1-o.y0)*(H-m.t-m.b);
 const pr=t=>Array.isArray(t)?t:[t,fmtn(t)];
 let s=`<svg viewBox="0 0 ${W} ${H}" class="plot" role="img" aria-label="${o.al||'Graphique'}">`;
 (o.bands||[]).forEach(b=>{if(!b.nf)s+=`<rect x="${X(b.a)}" y="${m.t}" width="${Math.max(0,X(b.b)-X(b.a))}" height="${H-m.t-m.b}" class="band"/>`;if(b.l)s+=`<text x="${(X(b.a)+X(b.b))/2}" y="${m.t+15}" text-anchor="middle">${b.l}</text>`});
 (o.xt||[]).forEach(t=>{const[v,l]=pr(t);s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${m.t}" y2="${H-m.b}" class="grid"/><text x="${X(v)}" y="${H-m.b+18}" text-anchor="middle">${l}</text>`});
 (o.yt||[]).forEach(t=>{const[v,l]=pr(t);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${m.l-7}" y="${Y(v)+4}" text-anchor="end">${l}</text>`});
 (o.hl||[]).forEach(v=>{s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${Y(v)}" y2="${Y(v)}" class="ref"/>`});
 s+=`<line x1="${m.l}" y1="${H-m.b}" x2="${W-m.r}" y2="${H-m.b}" class="axis"/><line x1="${m.l}" y1="${m.t}" x2="${m.l}" y2="${H-m.b}" class="axis"/>`;
 if(o.xl)s+=`<text x="${(W+m.l)/2}" y="${H-8}" text-anchor="middle" class="al">${o.xl}</text>`;
 if(o.yl)s+=`<text transform="translate(15 ${(H-m.b+m.t)/2}) rotate(-90)" text-anchor="middle" class="al">${o.yl}</text>`;
 if(o.extra)s+=o.extra(X,Y);
 (o.series||[]).forEach(se=>{if(!se.pts.length)return;s+=`<path d="M${se.pts.map(p=>X(p[0]).toFixed(1)+','+Y(p[1]).toFixed(1)).join('L')}" class="ser" style="stroke:${se.c};stroke-width:${se.w||2.6}${se.dash?';stroke-dasharray:7 5':''}"/>`;if(se.dots)se.pts.forEach(p=>{s+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="3.8" style="fill:${se.c}"/>`})});
 (o.marks||[]).forEach(k=>{s+=`<circle cx="${X(k.x)}" cy="${Y(k.y)}" r="5.5" class="mk"/>${k.l?`<text x="${Math.min(X(k.x)+9,W-110)}" y="${Math.max(Y(k.y)-10,m.t+12)}" class="mkl">${k.l}</text>`:''}`});
 const leg=(o.series||[]).filter(x=>x.l).map(x=>`<span><i style="background:${x.c}"></i>${x.l}</span>`).join('');
 return `<div class="pw">${s}</svg>${leg?`<div class="leg">${leg}</div>`:''}</div>`}
const range=(a,b,st)=>{const r=[];for(let x=a;x<=b+1e-9;x+=st)r.push(+x.toFixed(6));return r};
const fn=(a,b,st,f)=>range(a,b,st).map(x=>[x,f(x)]);
const geoDefs=()=>`<defs><pattern id="pCg" width="16" height="14" patternUnits="userSpaceOnUse"><rect width="16" height="14" class="fg2"/><circle cx="4" cy="4" r="3" class="nof sk"/><circle cx="12" cy="10" r="2.3" class="nof sk"/></pattern><pattern id="pSa" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" class="fg1"/><circle cx="2" cy="2" r=".9" class="fink"/><circle cx="6" cy="6" r=".9" class="fink"/></pattern><pattern id="pAr" width="14" height="7" patternUnits="userSpaceOnUse"><rect width="14" height="7" class="fg4"/><path d="M1 3.5h8" class="nof sk"/></pattern><pattern id="pCa" width="20" height="12" patternUnits="userSpaceOnUse"><rect width="20" height="12" class="fg5"/><path d="M0 .5h20M0 6.5h20M5 0v6M15 6v6" class="nof sk"/></pattern><pattern id="pSub" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" class="fg3"/><path d="M0 12L12 0" class="nof sk"/></pattern></defs>`;
const gs=(x,m,s)=>Math.exp(-(((x-m)/s)**2)/2);
const ABS={a:x=>gs(x,430,14)+.78*gs(x,662,11)+.12*gs(x,615,14),b:x=>gs(x,455,14)+.52*gs(x,642,11)+.1*gs(x,595,14),c:x=>.85*gs(x,448,14)+.8*gs(x,476,13)+.55*gs(x,422,12)};
ABS.brut=x=>(ABS.a(x)+.45*ABS.b(x)+.5*ABS.c(x))/1.62;
const VIS=`<linearGradient id="vis" x1="0" x2="1"><stop offset="0" stop-color="#6A3DB8"/><stop offset=".17" stop-color="#2C5EE8"/><stop offset=".3" stop-color="#19A6C9"/><stop offset=".4" stop-color="#3AAE3A"/><stop offset=".57" stop-color="#E3D629"/><stop offset=".67" stop-color="#F08C1C"/><stop offset=".83" stop-color="#E3261C"/><stop offset="1" stop-color="#8A1010"/></linearGradient>`;
const SIMS={};

/* ---------- Unité 1 : géologie ---------- */
SIMS.granulo=r=>{
 const S=[2,1,.5,.25,.125,.063],P={dune:[0,0,2,30,58,8,2],plage:[2,8,20,35,25,7,3],fluv:[20,13,12,11,11,13,20]};
 const T={dune:`Courbe très redressée : les grains ont presque tous la même taille. Seul un agent très sélectif, le <b>vent</b>, réalise un tri aussi poussé.`,plage:`Courbe redressée : bon classement. Le va-et-vient des <b>vagues</b> trie les grains, un peu moins bien que le vent.`,fluv:`Courbe étalée : toutes les tailles sont mélangées. Le <b>courant d'une rivière</b>, d'énergie variable, dépose des grains mal triés.`};
 let cur='dune';
 r.innerHTML=`<div class="ctl">${seg('s',[['dune','Sable de dune'],['plage','Sable de plage'],['fluv','Sable de rivière']],cur)}</div><div class="two"><div class="scroll"><table class="t"><thead><tr><th>Tamis (mm)</th><th>Refus (g)</th><th>% cumulé</th></tr></thead><tbody>${S.map((d,i)=>`<tr><td>${fmtn(d)}</td><td><input type="number" min="0" step="0.1" data-i="${i}" aria-label="Refus du tamis ${fmtn(d)} mm"></td><td data-c="${i}"></td></tr>`).join('')}<tr><td>Fond</td><td><input type="number" min="0" step="0.1" data-i="6" aria-label="Masse recueillie dans le fond"></td><td data-c="6"></td></tr></tbody></table><p class="note">Remplacez les masses par celles mesurées en classe : la courbe se recalcule.</p></div><div data-f></div></div><div class="out" data-out></div>`;
 const ins=[...r.querySelectorAll('input[data-i]')];
 const qt=(pts,v)=>{for(let i=0;i<pts.length-1;i++){const[a,ya]=pts[i],[b,yb]=pts[i+1];if(ya<=v&&yb>=v&&yb>ya){const t=(v-ya)/(yb-ya);return 10**(Math.log10(a)+t*(Math.log10(b)-Math.log10(a)))}}return null};
 function draw(){
  const m=ins.map(x=>Math.max(0,+x.value||0)),tot=m.reduce((a,b)=>a+b,0)||1;let c=0;const cum=m.map(v=>(c+=v)/tot*100);
  cum.forEach((v,i)=>{q(r,`[data-c="${i}"]`).textContent=fmt(v,1)});
  const pts=[[3,0],...S.map((d,i)=>[d,cum[i]])],q25=qt(pts,25),q50=qt(pts,50),q75=qt(pts,75);
  q(r,'[data-f]').innerHTML=plot({x0:3,x1:.05,xlog:1,y0:0,y1:100,xt:S.map(d=>[d,fmtn(d)]),yt:[0,25,50,75,100],hl:[25,50,75],xl:'Diamètre des mailles (mm), échelle log',yl:'% cumulé des refus',series:[{pts,c:'var(--u1)',dots:1}],al:'Courbe granulométrique cumulative'});
  let o='';
  if(q25&&q75){const so=Math.sqrt(q25/q75),cl=so<=1.6?'très bien classé':so<=2.5?'bien classé':so<=4?'moyennement classé':'mal classé';o=`<p>Lecture graphique : Q25 = ${fmt(q25,2)} mm ; médiane = ${fmt(q50,2)} mm ; Q75 = ${fmt(q75,3)} mm.</p><p>Coefficient de classement : So = √(Q25 / Q75) = <b>${fmt(so,2)}</b>, sédiment <b>${cl}</b>. Plus So est proche de 1, meilleur est le tri.</p>`}
  else o=`<p>Les quartiles ne peuvent pas être lus : trop de matériel est resté dans le fond.</p>`;
  if(P[cur]&&P[cur].every((v,i)=>v==m[i]))o+=`<p>${T[cur]}</p>`;
  q(r,'[data-out]').innerHTML=o}
 const load=k=>{P[k].forEach((v,i)=>ins[i].value=v);draw()};
 ins.forEach(x=>x.addEventListener('input',draw));
 onSeg(r,'s',k=>{cur=k;load(k)});load(cur)};

SIMS.morpho=r=>{
 const P={riv:[65,30,5],plage:[10,80,10],dune:[5,15,80]},L=['Non usés (NU)','Émoussés-luisants (EL)','Ronds-mats (RM)'];
 const T={riv:`Majorité de grains <b>non usés</b>, anguleux : transport court, dépôt proche de la roche d'origine.`,plage:`Majorité de grains <b>émoussés-luisants</b> : usure dans l'eau, où les chocs sont amortis ; transport aquatique prolongé.`,dune:`Majorité de grains <b>ronds-mats</b> : chocs violents entre les grains dans l'air ; transport éolien.`};
 r.innerHTML=`<div class="ctl">${seg('s',[['riv','Sable de rivière (amont)'],['plage','Sable de plage'],['dune','Sable de dune']],'riv')}</div><div class="two"><div data-f></div><div data-bars></div></div><div class="out" data-out></div>`;
 const grain=(t,cx,cy,g)=>{
  if(t==0){const p=[];for(let k=0;k<7;k++){const a=k/7*6.283+g()*.5,rr=17+g()*15;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return `<polygon points="${p.join(' ')}" class="fg1 sk"/>`}
  if(t==1)return `<g transform="rotate(${(g()*60-30).toFixed(0)} ${cx} ${cy})"><ellipse cx="${cx}" cy="${cy}" rx="${(25+g()*6).toFixed(1)}" ry="${(18+g()*4).toFixed(1)}" class="fg1 sk"/><ellipse cx="${cx-8}" cy="${cy-7}" rx="8" ry="3.5" class="shine"/></g>`;
  return `<circle cx="${cx}" cy="${cy}" r="${(23+g()*4).toFixed(1)}" class="sk" style="fill:url(#mat)"/>`};
 function draw(k){
  const p=P[k],n=[Math.round(p[0]*.12),Math.round(p[1]*.12)];n.push(12-n[0]-n[1]);
  const ty=[];n.forEach((c,t)=>{for(let i=0;i<c;i++)ty.push(t)});const g=rng(7);
  for(let i=ty.length-1;i>0;i--){const j=Math.floor(g()*(i+1));[ty[i],ty[j]]=[ty[j],ty[i]]}
  let s=`<svg viewBox="0 0 360 250" class="pic" role="img" aria-label="Grains de quartz observés à la loupe binoculaire"><defs><pattern id="mat" width="5" height="5" patternUnits="userSpaceOnUse"><rect width="5" height="5" class="fg1"/><circle cx="1.5" cy="1.5" r=".8" class="fmut"/><circle cx="4" cy="3.8" r=".6" class="fmut"/></pattern></defs>`;
  ty.forEach((t,i)=>{s+=grain(t,45+(i%4)*90,45+Math.floor(i/4)*80,g)});
  q(r,'[data-f]').innerHTML=s+'</svg>';
  q(r,'[data-bars]').innerHTML=`<p class="lbl">Pourcentage des grains observés</p>`+p.map((v,i)=>`<div class="bar"><span>${L[i]}</span><div><i style="width:${v}%"></i></div><b>${v} %</b></div>`).join('');
  q(r,'[data-out]').innerHTML=`<p>${T[k]}</p>`}
 onSeg(r,'s',draw);draw('riv')};

SIMS.decant=r=>{
 r.innerHTML=`<div class="ctl">${btn('go','Agiter puis laisser décanter')}</div><div data-f style="max-width:440px;margin:auto"></div><div class="out" data-out><p>L'éprouvette contient de l'eau et un mélange de gravier, de sable et d'argile.</p></div>`;
 const K=[{n:14,r:6,v:3.2,a:263,b:283,c:'fg3'},{n:45,r:2.8,v:1.1,a:240,b:258,c:'fg2'},{n:170,r:1.2,v:.33,a:226,b:236,c:'fmut'}];
 const g=rng(3),P=[];
 K.forEach((k,ki)=>{for(let i=0;i<k.n;i++)P.push({k:ki,x:128+g()*104,y:0,ty:k.a+g()*(k.b-k.a)})});
 P.forEach(p=>p.y=p.ty);
 const f=q(r,'[data-f]'),out=h=>{q(r,'[data-out]').innerHTML=h};
 function render(tb,lab){let s=`<svg viewBox="0 0 360 300" class="pic" role="img" aria-label="Éprouvette de décantation"><rect x="122" y="60" width="116" height="229" class="fwater"/>`;
  P.forEach(p=>{const k=K[p.k];s+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${k.r}" class="${k.c}"/>`});
  if(tb>0)s+=`<rect x="122" y="60" width="116" height="170" class="turb" style="opacity:${tb.toFixed(2)}"/>`;
  s+=`<path d="M120 40 V280 Q120 292 132 292 H228 Q240 292 240 280 V40" class="glass"/><path d="M110 40 H250" class="glass"/>`;
  if(lab)s+=`<path d="M244 273 H262 M244 249 H262 M244 231 H262" class="lnk"/><text x="266" y="277">gravier</text><text x="266" y="253">sable</text><text x="266" y="235">argile</text>`;
  f.innerHTML=s+'</svg>'}
 const done=()=>out(`<p>Les particules se sont déposées par ordre de taille décroissante : gravier au fond, puis sable, puis argile au sommet. C'est un <b>granoclassement</b>.</p>`);
 let raf;later(()=>cancelAnimationFrame(raf));
 onBtn(r,'go',()=>{cancelAnimationFrame(raf);P.forEach(p=>{p.y=64+g()*(p.ty-64);p.x=128+g()*104});
  if(RM){P.forEach(p=>p.y=p.ty);render(0,1);done();return}
  out(`<p>Décantation en cours : observez l'ordre d'arrivée des particules au fond.</p>`);
  const step=()=>{let mv=0,cl=0;P.forEach(p=>{if(p.y<p.ty){p.y=Math.min(p.ty,p.y+K[p.k].v);mv++;if(p.k==2)cl++}});render(cl/K[2].n*.6,!mv);if(mv)raf=requestAnimationFrame(step);else done()};step()});
 render(0,1)};

SIMS.calci=r=>{
 const P={calc:['Calcaire',47],cm:['Calcaire marneux',37],marne:['Marne',24],am:['Argile marneuse',9],arg:['Argile',1.5]};
 const C=[[0,5,'Argile'],[5,35,'Argile marneuse'],[35,65,'Marne'],[65,95,'Calcaire marneux'],[95,100,'Calcaire']];
 r.innerHTML=`<div class="ctl">${seg('s',Object.entries(P).map(([k,v])=>[k,v[0]]),'calc')}</div><div class="grid4"><label>Masse du témoin CaCO₃ pur m₀ (g)<input type="number" step="0.01" min="0" data-k="m0" value="0.2"></label><label>Volume de CO₂ du témoin V₀ (mL)<input type="number" step="0.1" min="0" data-k="v0" value="48"></label><label>Masse de l'échantillon m (g)<input type="number" step="0.01" min="0" data-k="m" value="0.2"></label><label>Volume de CO₂ dégagé V (mL)<input type="number" step="0.1" min="0" data-k="v" value="47"></label></div><div data-f style="max-width:640px"></div><div class="out" data-out></div>`;
 const g=k=>+q(r,`[data-k="${k}"]`).value||0;
 function draw(){const d=g('v0')*g('m'),pc=d?Math.min(100,Math.max(0,g('v')*g('m0')*100/d)):0,cl=C.find(c=>pc>=c[0]&&pc<=c[1])[2],X=v=>20+v*5.2;
  let s=`<svg viewBox="0 0 560 104" class="pic" role="img" aria-label="Classification des roches selon leur taux de calcaire">`;
  C.forEach((c,i)=>{s+=`<rect x="${X(c[0])}" y="26" width="${(c[1]-c[0])*5.2}" height="26" class="${i%2?'fg1':'fg4'} sk"/><text x="${i==4?X(100):X((c[0]+c[1])/2)}" y="${i%2?99:82}" text-anchor="${i==4?'end':'middle'}">${c[2]}</text>`});
  [0,5,35,65,95,100].forEach(v=>{s+=`<text x="${X(v)}" y="18" text-anchor="middle">${v}</text>`});
  s+=`<path d="M${X(pc).toFixed(1)} 55 l-7 11 h14z" class="fhot"/></svg>`;
  q(r,'[data-f]').innerHTML=s;
  q(r,'[data-out]').innerHTML=`<p>% CaCO₃ = (V × m₀ × 100) / (V₀ × m) = <b>${fmt(pc,1)} %</b> ; roche : <b>${cl}</b>.</p><p><span class="eq">CaCO₃ + 2 HCl → CaCl₂ + CO₂ + H₂O</span></p>`}
 r.querySelectorAll('[data-k]').forEach(x=>x.addEventListener('input',draw));
 onSeg(r,'s',k=>{q(r,'[data-k="v"]').value=P[k][1];q(r,'[data-k="m"]').value=0.2;draw()});draw()};

SIMS.chaux=r=>{
 const S=[{t:0,a:`Souffler de l'air expiré dans l'eau de chaux`,d:`Eau de chaux limpide : solution d'hydroxyde de calcium Ca(OH)₂.`},
 {t:.75,a:`Continuer à souffler plusieurs minutes`,d:`Un trouble blanc apparaît : le CO₂ de l'air expiré provoque la précipitation du carbonate de calcium.<br><span class="eq">Ca(OH)₂ + CO₂ → CaCO₃ ↓ + H₂O</span>`,straw:1},
 {t:0,a:`Chauffer la solution`,d:`La solution redevient limpide : le CO₂ en excès dissout le calcaire sous forme d'hydrogénocarbonate de calcium, soluble.<br><span class="eq">CaCO₃ + CO₂ + H₂O → Ca(HCO₃)₂</span>`,straw:1},
 {t:.65,a:`Recommencer`,d:`Le trouble réapparaît : la chaleur chasse le CO₂ dissous et le calcaire précipite.<br><span class="eq">Ca(HCO₃)₂ → CaCO₃ ↓ + CO₂ ↑ + H₂O</span>`,heat:1}];
 let i=0;
 r.innerHTML=`<div class="ctl">${btn('go','')}</div><div class="two"><div data-f style="max-width:360px"></div><div class="out" data-out style="margin-top:0;align-self:start"></div></div>`;
 function draw(){const s=S[i],g=rng(5);q(r,'[data-b="go"]').textContent=s.a;
  let v=`<svg viewBox="0 0 300 280" class="pic" role="img" aria-label="Tube contenant de l'eau de chaux"><rect x="112" y="90" width="76" height="140" class="fwater"/>`;
  if(s.t){v+=`<rect x="112" y="90" width="76" height="140" style="fill:#fff;opacity:${s.t*.8}"/>`;for(let k=0;k<40;k++)v+=`<circle cx="${(116+g()*68).toFixed(1)}" cy="${(222+g()*10).toFixed(1)}" r="1.6" class="fmut"/>`}
  v+=`<path d="M110 40 V225 Q110 240 125 240 H175 Q190 240 190 225 V40" class="glass"/>`;
  if(s.straw)v+=`<path d="M160 20 L150 215" style="stroke:var(--u1);stroke-width:6;stroke-linecap:round"/>`+[0,1,2,3].map(k=>`<circle cx="${140+k*6}" cy="${205-k*30}" r="4" class="nof sk"/>`).join('');
  if(s.heat)v+=`<path d="M150 276 C134 266 138 252 150 246 C152 256 158 258 160 250 C168 260 166 270 150 276Z" class="fhot"/>`+[0,1,2].map(k=>`<circle cx="${130+k*20}" cy="${104+k*14}" r="3" class="nof sk"/>`).join('');
  q(r,'[data-f]').innerHTML=v+'</svg>';
  q(r,'[data-out]').innerHTML=`<p class="lbl">Étape ${i+1} sur 4</p><p>${s.d}</p>`}
 onBtn(r,'go',()=>{i=(i+1)%4;draw()});draw()};

SIMS.transg=r=>{
 const F=[{n:'Émersion (lacune)'},{n:'Conglomérat, sable grossier',p:'pCg'},{n:'Sable fin',p:'pSa'},{n:'Argile',p:'pAr'},{n:'Calcaire',p:'pCa'}];
 let L=1,col=[];
 r.innerHTML=`<div class="ctl">${sl('l','Niveau de la mer :',0,4,1,L)}${btn('dep','Déposer une couche')}${btn('rz','Effacer la colonne','ghost')}</div><div class="two"><div data-sec></div><div data-col></div></div><div class="out" data-out></div>`;
 function sec(){const ys=150-L*25,xs=(ys-60)/.344;
  let s=`<svg viewBox="0 0 340 200" class="pic" role="img" aria-label="Coupe d'une bordure continentale">${geoDefs()}<polygon points="0,60 340,177 340,200 0,200" style="fill:url(#pSub)"/>`;
  const pts=xs<0?`0,${ys} 340,${ys} 340,177 0,60`:`${xs.toFixed(1)},${ys} 340,${ys} 340,177`;
  s+=`<polygon points="${pts}" class="fwater"/><path d="M${Math.max(0,xs).toFixed(1)} ${ys}H340" style="stroke:var(--u3);stroke-width:2"/>`;
  s+=`<path d="M200 128.8 l-6 -11 h12z" class="fhot"/><text x="200" y="${ys<112?ys-6:108}" text-anchor="middle" class="lab" style="font-size:12px">site étudié</text>`;
  s+=`<text x="12" y="44">continent</text><text x="330" y="${Math.min(ys+18,172)}" text-anchor="end">mer</text></svg>`;
  q(r,'[data-sec]').innerHTML=s}
 function column(){let s=`<svg viewBox="0 0 320 250" class="pic" role="img" aria-label="Colonne stratigraphique du site">${geoDefs()}<rect x="30" y="226" width="90" height="12" style="fill:url(#pSub)" class="sk"/>`;
  let y=226;col.forEach(l=>{if(l==0){s+=`<path d="M26 ${y} q8 -5 16 0 t16 0 t16 0 t16 0 t16 0 t16 0" class="cut"/><text x="130" y="${y+4}">lacune</text>`;return}y-=26;s+=`<rect x="30" y="${y}" width="90" height="26" style="fill:url(#${F[l].p})" class="sk"/><text x="130" y="${y+17}">${F[l].n}</text>`});
  if(!col.length)s+=`<text x="30" y="210">Déposez une première couche.</text>`;
  q(r,'[data-col]').innerHTML=s+'</svg>'}
 function interp(){const d=col.filter(l=>l>0);let o=`<p>Au site étudié, ce niveau marin correspond au faciès : <b>${F[L].n}</b>.</p>`;
  if(d.length>=2){const up=d.every((v,i)=>!i||v>=d[i-1]),dn=d.every((v,i)=>!i||v<=d[i-1]);
   if(up&&d[d.length-1]>d[0])o+=`<p><b>Série transgressive</b> : de bas en haut, les faciès sont de plus en plus fins et de plus en plus profonds. La mer avance sur le continent.</p>`;
   else if(dn&&d[d.length-1]<d[0])o+=`<p><b>Série régressive</b> : de bas en haut, les faciès sont de plus en plus grossiers et de moins en moins profonds. La mer recule.</p>`;
   else o+=`<p>La colonne enregistre une alternance de transgressions et de régressions.</p>`}
  if(col.includes(0))o+=`<p>La lacune correspond à une période d'émersion : pas de sédimentation, parfois érosion.</p>`;
  q(r,'[data-out]').innerHTML=o}
 onSl(r,'l',v=>{L=v;sec();interp()});
 onBtn(r,'dep',()=>{if(col.length<8){col.push(L);column();interp()}});
 onBtn(r,'rz',()=>{col=[];column();interp()});sec();column();interp()};

SIMS.chrono=r=>{
 const OK=['A','B','C','G','F','D'],N={A:'Couche A',B:'Couche B',C:'Couche C',D:'Couche D',F:'Faille F',G:'Filon G'};let seq=[];
 const blk=`<rect x="0" y="45" width="360" height="75" style="fill:url(#pCa)"/><rect x="0" y="120" width="360" height="50" style="fill:url(#pAr)"/><rect x="0" y="170" width="360" height="100" style="fill:url(#pSa)"/><path d="M0 120H360M0 170H360" class="nof sk"/><polygon points="16,265 34,265 344,45 326,45" class="fdark"/>`;
 const svg=`<svg viewBox="0 0 360 250" class="pic" role="img" aria-label="Coupe géologique à interpréter">${geoDefs()}<defs><clipPath id="clL"><polygon points="0,70 250,70 200,240 0,240"/></clipPath><clipPath id="clR"><polygon points="250,70 360,70 360,240 200,240"/></clipPath></defs><g clip-path="url(#clL)">${blk}</g><g clip-path="url(#clR)"><g transform="translate(0 25)">${blk}</g></g><rect x="0" y="40" width="360" height="30" style="fill:url(#pCg)"/><path d="M0 70H360" style="stroke:var(--ink);stroke-width:2.5"/><path d="M200 240L250 70" style="stroke:var(--hot);stroke-width:3"/><rect x="0" y="40" width="360" height="200" class="nof sk"/><text x="12" y="60" class="lab">D</text><text x="12" y="100" class="lab">C</text><text x="12" y="150" class="lab">B</text><text x="12" y="212" class="lab">A</text><text x="336" y="112" class="lab">C</text><text x="336" y="168" class="lab">B</text><text x="336" y="222" class="lab">A</text><text x="138" y="196" class="lab">G</text><text x="236" y="150" class="lab">F</text></svg>`;
 r.innerHTML=`<div data-f style="max-width:600px">${svg}</div><p class="lbl" style="margin-top:10px">Touchez les événements du plus ancien au plus récent :</p><div class="ctl" data-ev>${['A','B','C','D','F','G'].map(k=>`<button type="button" class="b ghost" data-e="${k}">${N[k]}</button>`).join('')}</div><div class="ctl">${btn('chk','Vérifier')}${btn('clr','Effacer','ghost')}</div><div class="out" data-out></div>`;
 const show=h=>{q(r,'[data-out]').innerHTML=h};
 const showSeq=()=>show(`<p>Votre ordre : ${seq.length?seq.map(k=>N[k]).join(', puis '):'aucun événement choisi'}.</p>`);
 q(r,'[data-ev]').addEventListener('click',e=>{const b=e.target.closest('[data-e]');if(!b||seq.includes(b.dataset.e))return;seq.push(b.dataset.e);b.disabled=true;b.style.opacity=.45;showSeq()});
 onBtn(r,'clr',()=>{seq=[];r.querySelectorAll('[data-e]').forEach(b=>{b.disabled=false;b.style.opacity=1});showSeq()});
 onBtn(r,'chk',()=>{if(seq.length<6){show(`<p>Classez les six événements avant de vérifier.</p>`);return}const good=seq.every((k,i)=>k==OK[i]);
  show(`<p><b>${good?'Ordre exact.':'Ordre à corriger.'}</b> Ordre attendu : ${OK.map(k=>N[k]).join(', puis ')}.</p><p>Superposition : A est recouverte par B, elle-même recouverte par C. Recoupement : le filon G traverse A, B et C, il leur est postérieur ; la faille F décale le filon G, elle est donc postérieure à G. La surface d'érosion tronque C, G et F ; la couche D repose dessus et n'est pas décalée par la faille : c'est l'événement le plus récent. Inclusion : les galets du conglomérat D proviennent de roches plus anciennes.</p>`)});
 showSeq()};

SIMS.regleV=r=>{
 const C={hor:['Couche horizontale','0,160 180,115 360,160',`La limite d'affleurement suit les courbes de niveau : le V pointe vers l'amont, parallèle aux courbes.`],
 ver:['Couche verticale','0,130 360,130',`La limite d'affleurement est une droite, indépendante du relief.`],
 am:["Pendage vers l'amont",'0,150 180,126 360,150',`Le V pointe vers l'amont, mais il est plus ouvert que les courbes de niveau.`],
 av:["Pendage vers l'aval",'0,108 180,152 360,108',`Le V pointe vers l'aval (pendage plus fort que la pente du fond de la vallée).`]};
 r.innerHTML=`<div class="ctl">${seg('c',Object.entries(C).map(([k,v])=>[k,v[0]]),'hor')}</div><div data-f style="max-width:600px"></div><div class="out" data-out></div>`;
 function draw(k){let s=`<svg viewBox="0 0 360 252" class="pic" role="img" aria-label="Vue en plan d'une vallée et limite d'affleurement d'une couche">`;

SIMS.racine=r=>{let j=0;

 const vA=d=>50-3.5*d,Yv=v=>272-v*3.6;
 function tube(x,v,plant,lab){const y=Yv(v);let s=`<rect x="${x+2}" y="${y}" width="42" height="${272-y}" class="fwater"/><rect x="${x+2}" y="${y-6}" width="42" height="6" style="fill:#E3C75A"/>`;
  if(plant)s+=`<path d="M${x+23} ${y+4} q-8 30 -12 70 M${x+23} ${y+4} q2 40 0 80 M${x+23} ${y+4} q10 30 12 66" class="nof" style="stroke:var(--u1);stroke-width:1.6"/><path d="M${x+23} ${y+4} V14" style="stroke:var(--u2);stroke-width:4"/><ellipse cx="${x+8}" cy="26" rx="15" ry="6" transform="rotate(-25 ${x+8} 26)" style="fill:var(--u2)"/><ellipse cx="${x+38}" cy="40" rx="15" ry="6" transform="rotate(25 ${x+38} 40)" style="fill:var(--u2)"/>`;

 function draw(){let s=`<svg viewBox="0 0 300 300" class="pic" role="img" aria-label="Éprouvettes graduées avec et sans plante">`;
  [0,10,20,30,40,50].forEach(v=>{s+=`<path d="M52 ${Yv(v)}h8" class="nof sk"/><text x="48" y="${Yv(v)+4}" text-anchor="end">${v}</text>`});

  q(r,'[data-out]').innerHTML=`<p>Volume absorbé par la plante en ${j} jour(s) : <b>${fmt(3.5*j,1)} mL</b>. Volume perdu par le témoin : <b>0 mL</b>, car la couche d'huile empêche l'évaporation.</p>`}

SIMS.dutro=r=>{let ci=.5,ce=0;
 r.innerHTML=`<div class="ctl">${sl('ci',"Saccharose dans l'entonnoir :",0,1,.1,ci,'mol/L')}${sl('ce','Saccharose dans le bécher :',0,1,.1,ce,'mol/L')}</div><div class="two"><div data-f style="max-width:320px"></div><div data-g></div></div><div class="out" data-out></div>`;
 function draw(){const he=100*(ci-ce),h=t=>he*(1-Math.exp(-t/9)),y=Math.min(185,Math.max(24,150-h(40)*.9));
  let s=`<svg viewBox="0 0 260 300" class="pic" role="img" aria-label="Osmomètre de Dutrochet"><rect x="22" y="170" width="216" height="114" class="fwater"/><path d="M20 150 V286 H240 V150" class="glass"/>`;
  s+=`<path d="M78 255 L126 190 V${y.toFixed(1)} H134 V190 L182 255 Z" class="fsol"/><path d="M78 255 L126 190 V16 M134 16 V190 L182 255" class="glass"/><path d="M76 255 H184" style="stroke:var(--u1);stroke-width:4;stroke-dasharray:5 3"/>`;
  s+=`<path d="M136 150 H158" class="lnk"/><text x="161" y="154">niveau initial</text><text x="130" y="276" text-anchor="middle">membrane semi-perméable</text></svg>`;
  q(r,'[data-f]').innerHTML=s;
  q(r,'[data-g]').innerHTML=plot({x0:0,x1:40,y0:-100,y1:100,xt:[0,10,20,30,40],yt:[-100,-50,0,50,100],hl:[0],xl:'Temps (min)',yl:'Variation du niveau (mm)',series:[{pts:fn(0,40,1,h),c:'var(--u2)'}],al:'Variation du niveau dans le tube'});
  const d=ci-ce;q(r,'[data-out]').innerHTML=Math.abs(d)<1e-6?`<p>Concentrations égales : milieux <b>isotoniques</b>, pas de flux net d'eau, le niveau ne varie pas.</p>`:d>0?`<p>La solution de l'entonnoir est <b>hypertonique</b> : l'eau entre dans l'entonnoir à travers la membrane, le niveau <b>monte</b> puis se stabilise quand la pression hydrostatique équilibre la pression osmotique.</p>`:`<p>La solution de l'entonnoir est <b>hypotonique</b> : l'eau sort de l'entonnoir vers le bécher, le niveau <b>descend</b>.</p>`}
 onSl(r,'ci',v=>{ci=v;draw()});onSl(r,'ce',v=>{ce=v;draw()});draw()};

SIMS.plasmo=r=>{let ty='oig',c=0;
 r.innerHTML=`<div class="ctl">${seg('t',[['oig',"Épiderme d'oignon rouge"],['gr','Globules rouges']],ty)}${sl('c','Solution de NaCl :',0,30,.5,0,'g/L')}</div><div data-f style="max-width:600px"></div><div class="out" data-out></div>`;
 function oig(){const k=c<=9?1:c<=11?.95:Math.max(.4,.95-(c-11)*.03);let s=`<svg viewBox="0 0 360 236" class="pic" role="img" aria-label="Cellules d'épiderme d'oignon rouge au microscope">`;
  [20,190].forEach(x=>{const cx=x+75,cy=115,w=136*k,h=176*k,rx=4+(1-k)*70;
   s+=`<rect x="${x}" y="20" width="150" height="190" class="fcell" style="stroke:var(--ink);stroke-width:4"/><rect x="${(cx-w/2).toFixed(1)}" y="${(cy-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${rx.toFixed(1)}" class="fg5 sk"/><rect x="${(cx-w/2+7).toFixed(1)}" y="${(cy-h/2+7).toFixed(1)}" width="${(w-14).toFixed(1)}" height="${(h-14).toFixed(1)}" rx="${Math.max(0,rx-5).toFixed(1)}" style="fill:var(--antho);opacity:${Math.min(1,.45+(1-k)*1.1).toFixed(2)}"/><circle cx="${(cx-w/2+14).toFixed(1)}" cy="${(cy-h/2+16).toFixed(1)}" r="7" class="fmut"/>`});
  s+=`<text x="95" y="228" text-anchor="middle">paroi</text><text x="265" y="228" text-anchor="middle">vacuole colorée</text></svg>`;
  const st=c<=9?`Milieu <b>hypotonique</b> par rapport au suc vacuolaire : l'eau entre dans la vacuole, qui occupe presque tout le volume de la cellule. La cellule est <b>turgescente</b>.`:c<=11?`Milieu proche de l'isotonie : début de décollement du cytoplasme dans les angles, c'est la <b>plasmolyse naissante</b>.`:`Milieu <b>hypertonique</b> : l'eau sort de la vacuole, qui se rétracte et se colore plus intensément ; le cytoplasme se décolle de la paroi. La cellule est <b>plasmolysée</b>. Ramenez le curseur à 0 g/L : la déplasmolyse montre que le phénomène est réversible.`;
  return [s,st]}
 function gr(){const P=[[70,70],[180,60],[290,80],[120,165],[240,170]];let s=`<svg viewBox="0 0 360 236" class="pic" role="img" aria-label="Globules rouges au microscope">`;
  P.forEach(([x,y])=>{
   if(c<4)s+=`<circle cx="${x}" cy="${y}" r="33" class="nof" style="stroke:var(--rbc);stroke-dasharray:5 7;stroke-width:2"/>`;
   else if(c<8.5)s+=`<circle cx="${x}" cy="${y}" r="${(36-(c-4)*.6).toFixed(1)}" style="fill:var(--rbc)"/>`;
   else if(c<=9.5)s+=`<circle cx="${x}" cy="${y}" r="30" style="fill:var(--rbc)"/><circle cx="${x}" cy="${y}" r="12" style="fill:var(--rbcl)"/>`;
   else{const R=Math.max(20,30-(c-9.5)*.5),n=16,p=[];for(let k=0;k<n*2;k++){const a=k/(n*2)*6.283,rr=k%2?R:R+5;p.push((x+rr*Math.cos(a)).toFixed(1)+','+(y+rr*Math.sin(a)).toFixed(1))}s+=`<polygon points="${p.join(' ')}" style="fill:var(--rbc)"/>`}});
  const st=c<4?`Milieu très <b>hypotonique</b> : l'eau entre massivement, la membrane se rompt et l'hémoglobine se répand : <b>hémolyse</b>.`:c<8.5?`Milieu <b>hypotonique</b> : l'eau entre, les globules rouges gonflent et deviennent sphériques.`:c<=9.5?`Milieu <b>isotonique</b> (9 g/L, eau physiologique) : les globules gardent leur forme de disque biconcave.`:`Milieu <b>hypertonique</b> : l'eau sort, les globules se ratatinent et prennent un aspect hérissé : <b>crénelure</b>.`;
  return [s+'</svg>',st]}
 function draw(){const[s,st]=ty=='oig'?oig():gr();q(r,'[data-f]').innerHTML=s;q(r,'[data-out]').innerHTML=`<p>${st}</p>`}
 onSeg(r,'t',v=>{ty=v;draw()});onSl(r,'c',v=>{c=v;draw()});draw()};

SIMS.posm=r=>{
 const S={glu:['Glucose',180,1],sac:['Saccharose',342,1],nacl:['NaCl',58.5,2],kcl:['KCl',74.5,2],cacl:['CaCl₂',111,3]};
 const opts=Object.entries(S).map(([k,v])=>`<option value="${k}">${v[0]} (M = ${fmtn(v[1])} g/mol ; i = ${v[2]})</option>`).join('');
 const col=(n,s,c)=>`<div class="sol"><h3>Solution ${n}</h3><label>Soluté<select data-s="${n}">${opts.replace(`value="${s}"`,`value="${s}" selected`)}</select></label><label>Concentration massique (g/L)<input type="number" step="0.1" min="0" data-c="${n}" value="${c}"></label></div>`;
 r.innerHTML=`<div class="grid4">${col('A','nacl',9)}${col('B','glu',55)}<label>Température (°C)<input type="number" step="1" data-t value="37"></label></div><div class="out" data-out></div>`;
 function P(n){const s=S[q(r,`[data-s="${n}"]`).value],cm=+q(r,`[data-c="${n}"]`).value||0,T=(+q(r,'[data-t]').value||0)+273,C=cm/s[1];return{s,cm,C,T,p:s[2]*C*.082*T}}
 function draw(){const A=P('A'),B=P('B'),m=Math.max(A.p,B.p);
  const line=(n,x)=>`<p><b>${n}</b> : C = ${fmtn(x.cm)} / ${fmtn(x.s[1])} = ${fmt(x.C,4)} mol/L ; P = ${x.s[2]} × ${fmt(x.C,4)} × 0,082 × ${x.T} = <b>${fmt(x.p,2)} atm</b> (environ ${fmt(x.p*101.325,0)} kPa)</p>`;
  let cmp='';
  if(m&&Math.abs(A.p-B.p)/m<.03)cmp=`<p>Les deux solutions sont pratiquement <b>isotoniques</b> : pas de flux net d'eau entre elles.</p>`;
  else if(m){const[h,l]=A.p>B.p?['A','B']:['B','A'];cmp=`<p>La solution ${h} est <b>hypertonique</b> par rapport à la solution ${l} : séparées par une membrane semi-perméable, l'eau irait de ${l} vers ${h}.</p>`}
  q(r,'[data-out]').innerHTML=line('Solution A',A)+line('Solution B',B)+cmp}
 r.querySelectorAll('select,input').forEach(x=>{x.addEventListener('input',draw);x.addEventListener('change',draw)});draw()};

SIMS.elodee=r=>{let L=60,T=25,co=1,B=[],gas=0,acc=0,raf,last=0;
 r.innerHTML=`<div class="ctl">${sl('l','Éclairement :',0,100,5,L,'%')}${sl('t','Température :',0,45,1,T,'°C')}${seg('c',[['1','Eau + NaHCO₃'],['0','Eau bouillie (sans CO₂)']],'1')}</div><div class="two"><div data-f style="max-width:380px"></div><div data-g></div></div><div class="ctl" style="margin-top:10px">${btn('test','Tester le gaz avec une bûchette incandescente','ghost')}</div><div class="out" data-out></div>`;
 const fT=t=>Math.max(0,1-((t-30)/16)**2),rate=(l,t,c)=>Math.round(48*fT(t)*(c?1:.08)*l/(l+25));
 q(r,'[data-f]').innerHTML=`<svg viewBox="0 0 330 300" class="pic" role="img" aria-label="Montage avec élodée éclairée"><circle cx="40" cy="150" r="30" data-glow style="fill:#F4D03F"/><rect x="8" y="138" width="22" height="24" class="fdark"/><path d="M70 150 H96" data-ray style="stroke:#E0B820;stroke-width:3;stroke-dasharray:4 4"/><rect x="102" y="90" width="206" height="196" class="fwater"/><path d="M100 70 V286 H310 V70" class="glass"/><path d="M130 272 L270 272 L214 206 L214 158 L186 158 L186 206 Z" class="nof sk" style="stroke-width:2"/><rect x="186" y="44" width="28" height="118" rx="12" class="fwater"/><rect x="186" y="44" width="28" height="0" data-gas class="fsurf"/><rect x="186" y="44" width="28" height="118" rx="12" class="nof sk" style="stroke-width:2"/><path d="M150 268 Q175 240 200 210 M250 268 Q225 240 200 210" style="stroke:var(--u2);stroke-width:3;fill:none"/>${[0,1,2,3,4,5].map(i=>`<ellipse cx="${156+i*8}" cy="${258-i*8}" rx="7" ry="2.4" transform="rotate(-40 ${156+i*8} ${258-i*8})" style="fill:var(--u2)"/><ellipse cx="${244-i*8}" cy="${258-i*8}" rx="7" ry="2.4" transform="rotate(40 ${244-i*8} ${258-i*8})" style="fill:var(--u2)"/>`).join('')}<g data-bub></g><path d="M218 56 H240" class="lnk"/><text x="243" y="60">gaz recueilli</text></svg>`;
 const bub=q(r,'[data-bub]'),gr=q(r,'[data-gas]'),glow=q(r,'[data-glow]'),ray=q(r,'[data-ray]');
 function upd(){const R=rate(L,T,co);glow.style.opacity=(.15+L/100*.85).toFixed(2);ray.style.opacity=L?1:0;

 let R=upd();
 const loop=ts=>{const dt=last?Math.min(.1,(ts-last)/1000):0;last=ts;acc+=dt*R/60*4;while(acc>=1){acc--;B.push({x:200+(Math.random()-.5)*6,y:206})}
