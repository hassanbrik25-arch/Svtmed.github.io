{id:'granulo',ch:'1.1',sim:'granulo',t:`Analyse granulométrique d'un sable`,
obj:`Déterminer la répartition des grains selon leur taille, en déduire le degré de tri du sédiment et l'agent de transport.`,
mat:`Colonne de tamis à mailles décroissantes (2 à 0,063 mm), balance, 100 g de sable sec, papier semi-logarithmique.`,
p:[`Sécher puis peser 100 g de sable.`,`Verser l'échantillon sur le tamis supérieur et agiter la colonne pendant 10 minutes.`,`Peser le refus de chaque tamis et le contenu du fond.`,`Calculer les pourcentages cumulés des refus.`,`Tracer la courbe cumulative (diamètre en abscisse logarithmique) et lire les quartiles Q25, Q50 et Q75.`],
r:`<p>La forme de la courbe dépend de l'origine du sable : très redressée pour le sable de dune, redressée pour le sable de plage, étalée pour le sable de rivière.</p>`,
i:`<p>Plus la courbe est redressée, plus les grains ont des tailles voisines : le sédiment est bien trié. Le tri dépend de l'agent de transport : le vent trie très bien, les vagues bien, les cours d'eau, d'énergie variable, mal. La granulométrie renseigne donc sur le milieu de dépôt, élément de la carte paléogéographique.</p>`,
q:[`Quel sable est le mieux trié ? Justifiez à l'aide de la forme de la courbe et de la valeur de So.`,`Quelle relation établissez-vous entre le degré de tri d'un sédiment et l'agent qui l'a transporté ?`]},
{id:'morpho',ch:'1.1',sim:'morpho',t:`Morphoscopie des grains de quartz`,
obj:`Relier l'aspect des grains de quartz (forme, état de surface) à l'agent et à la durée du transport.`,
mat:`Échantillons de sable, acide chlorhydrique dilué, loupe binoculaire, fond noir.`,
p:[`Laver le sable à l'acide chlorhydrique dilué pour éliminer le calcaire, rincer à l'eau et sécher.`,`Étaler les grains sur un fond noir.`,`Observer à la loupe binoculaire une centaine de grains de quartz.`,`Classer les grains : non usés (NU), émoussés-luisants (EL), ronds-mats (RM).`,`Calculer le pourcentage de chaque catégorie.`],
r:`<div class="scroll"><table class="t"><thead><tr><th>Type de grain</th><th>Aspect</th><th>Transport</th></tr></thead><tbody><tr><td>Non usé (NU)</td><td>Anguleux, arêtes vives</td><td>Faible ou nul</td></tr><tr><td>Émoussé-luisant (EL)</td><td>Arrondi, surface lisse et brillante</td><td>Par l'eau</td></tr><tr><td>Rond-mat (RM)</td><td>Sphérique, surface dépolie</td><td>Par le vent</td></tr></tbody></table></div>`,
i:`<p>La forme et l'état de surface des grains enregistrent leur histoire : l'eau amortit les chocs et polit les grains, qui deviennent luisants ; dans l'air, les grains s'entrechoquent violemment et leur surface devient mate. La catégorie dominante indique le milieu de dépôt.</p>`,
q:[`Pourquoi les grains transportés par le vent sont-ils mats, alors que ceux transportés par l'eau sont luisants ?`,`Un sable contient 70 % de grains ronds-mats : dans quel milieu s'est-il probablement déposé ?`]},
{id:'decant',ch:'1.1',sim:'decant',t:`Sédimentation d'un mélange dans l'eau`,
obj:`Montrer que les particules se déposent selon leur taille lorsque l'énergie du milieu diminue.`,
mat:`Grande éprouvette, eau, mélange de gravier, de sable et d'argile.`,
p:[`Verser le mélange dans l'éprouvette remplie d'eau.`,`Boucher et agiter vigoureusement.`,`Laisser reposer et observer l'ordre de dépôt pendant quelques minutes.`],
r:`<p>Le gravier se dépose d'abord, puis le sable ; l'argile reste longtemps en suspension, l'eau est trouble, avant de se déposer au sommet.</p>`,
i:`<p>La vitesse de chute d'une particule augmente avec sa taille et sa densité. Quand l'énergie du courant diminue, les éléments grossiers se déposent en premier : c'est le <b>granoclassement</b>, particules de plus en plus fines de bas en haut. Une couche granoclassée témoigne d'un ralentissement progressif du courant.</p>`,
q:[`Classez les particules selon leur vitesse de chute. Quel facteur explique cet ordre ?`,`Une couche montre des éléments grossiers à la base et fins au sommet : que peut-on en déduire sur l'énergie du courant ?`]},
{id:'calci',ch:'1.1',sim:'calci',t:`Dosage du calcaire au calcimètre de Bernard`,
obj:`Déterminer le pourcentage de carbonate de calcium d'une roche pour la nommer et préciser son milieu de formation.`,
mat:`Calcimètre de Bernard, acide chlorhydrique dilué, carbonate de calcium pur (témoin), balance, échantillons de roches broyées.`,
p:[`Réaliser le témoin : faire réagir une masse m₀ de CaCO₃ pur avec HCl et lire le volume de CO₂ dégagé V₀.`,`Recommencer avec une masse m de l'échantillon broyé et lire le volume V.`,`Calculer : % CaCO₃ = (V × m₀ × 100) / (V₀ × m).`,`Nommer la roche d'après son taux de calcaire.`],
r:`<p>Le volume de CO₂ dégagé est proportionnel à la masse de calcaire contenue dans l'échantillon : CaCO₃ + 2 HCl → CaCl₂ + CO₂ + H₂O.</p>`,
i:`<p>Le taux de CaCO₃ permet de nommer la roche : argile, marne, calcaire… Les calcaires se forment surtout en mer chaude et peu profonde, loin des apports détritiques ; les argiles et les marnes traduisent des apports continentaux fins. Ce dosage complète la reconstitution du milieu de sédimentation.</p>`,
q:[`Un échantillon de 0,5 g dégage 30 mL de CO₂ ; le témoin (0,2 g de CaCO₃ pur) dégage 48 mL. Calculez son taux de calcaire et nommez la roche.`,`Pourquoi réalise-t-on un témoin avec du carbonate de calcium pur ?`]},
{id:'chaux',ch:'1.1',sim:'chaux',t:`Précipitation et dissolution du calcaire`,
obj:`Identifier les facteurs qui contrôlent la dissolution et la précipitation du calcaire.`,
mat:`Eau de chaux, tube à essai, paille, bec Bunsen ou réchaud.`,
p:[`Souffler de l'air expiré dans l'eau de chaux et observer.`,`Continuer à souffler pendant plusieurs minutes.`,`Chauffer la solution redevenue limpide.`],
r:`<p>Un trouble blanc apparaît, puis disparaît quand on continue à souffler, puis réapparaît au chauffage.</p>`,
i:`<p>La réaction CaCO₃ + CO₂ + H₂O ⇌ Ca(HCO₃)₂ est réversible. Ce qui augmente le CO₂ dissous (eau froide, pression élevée) favorise la dissolution du calcaire ; ce qui en diminue la teneur (réchauffement, agitation, baisse de pression, photosynthèse des algues) provoque sa précipitation. On explique ainsi la formation des calcaires d'origine chimique (travertins, stalactites) et biochimique.</p>`,
q:[`Écrivez l'équation qui résume les étapes 2 et 3 sous la forme d'un équilibre.`,`Expliquez, à l'aide de cette expérience, la formation des stalactites dans une grotte.`]},
{id:'fossiles',ch:'1.1',t:`Fossiles de faciès et principe d'actualisme`,
obj:`Déduire le milieu de vie ancien à partir des fossiles, en le comparant aux organismes actuels.`,
mat:`Collection de fossiles ou photographies, documents sur les conditions de vie des espèces actuelles apparentées.`,
p:[`Observer et identifier les fossiles contenus dans la roche.`,`Rechercher les organismes actuels apparentés et leurs conditions de vie.`,`Appliquer le principe d'actualisme : les phénomènes actuels permettent d'expliquer ceux du passé.`],
r:`<div class="scroll"><table class="t"><thead><tr><th>Fossile</th><th>Milieu indiqué</th></tr></thead><tbody><tr><td>Coraux constructeurs de récifs</td><td>Mer chaude (plus de 20 °C), peu profonde, eau claire</td></tr><tr><td>Huîtres</td><td>Milieu littoral, eau peu profonde</td></tr><tr><td>Oursins, crinoïdes</td><td>Milieu marin de salinité normale</td></tr><tr><td>Limnées, planorbes</td><td>Eau douce (lac, étang)</td></tr><tr><td>Fougères arborescentes</td><td>Milieu continental chaud et humide</td></tr></tbody></table></div>`,
i:`<p>Un fossile de faciès appartient à un groupe aux exigences écologiques étroites : il renseigne sur le milieu de dépôt (marin, lacustre, continental) et sur ses conditions (température, profondeur, salinité). Associé aux données sédimentologiques, il permet de tracer la carte paléogéographique.</p>`,
q:[`Qu'est-ce qu'un fossile de faciès ? Donnez deux exemples.`,`Énoncez le principe d'actualisme et montrez ses limites.`]},
{id:'transg',ch:'1.2',sim:'transg',t:`Modélisation d'une transgression et d'une régression`,
obj:`Comprendre comment les variations du niveau marin modifient la succession verticale des faciès en un lieu donné.`,
mat:`Simulation, ou bac à sédiments incliné, eau, sables et argiles.`,
p:[`Choisir un niveau marin, puis déposer une couche au site étudié.`,`Répéter en faisant monter progressivement le niveau marin.`,`Recommencer en le faisant baisser.`,`Comparer les deux colonnes stratigraphiques obtenues.`],
r:`<p>Quand le niveau marin monte, les faciès se succèdent de bas en haut du plus grossier (littoral) au plus fin (large) ; c'est l'inverse quand il baisse.</p>`,
i:`<p>Une <b>transgression</b>, avancée de la mer sur le continent, produit une série de faciès de plus en plus profonds vers le haut, reposant souvent sur un conglomérat de base. Une <b>régression</b> donne une série de faciès de moins en moins profonds et peut s'achever par une émersion : lacune de sédimentation, érosion.</p>`,
q:[`Construisez une série transgressive puis une série régressive. Décrivez l'évolution de la taille des grains de bas en haut.`,`Que signifie la présence d'un conglomérat à la base d'une série marine ?`]},
{id:'chrono',ch:'1.2',sim:'chrono',t:`Datation relative : superposition, recoupement, inclusion`,
obj:`Reconstituer la chronologie des événements d'une coupe géologique grâce aux principes de la stratigraphie.`,
mat:`Coupe géologique (document ou simulation).`,
p:[`Observer la coupe : couches, faille, filon, surface d'érosion.`,`Appliquer le principe de superposition aux couches sédimentaires.`,`Appliquer le principe de recoupement aux structures qui traversent les couches.`,`Classer les événements du plus ancien au plus récent, puis vérifier.`],
r:`<p>Ordre : couche A, couche B, couche C, filon G, faille F, érosion, puis dépôt de la couche D.</p>`,
i:`<p><b>Superposition</b> : une couche est plus récente que celle qu'elle recouvre. <b>Recoupement</b> : une structure (filon, faille) est postérieure aux couches qu'elle recoupe. <b>Inclusion</b> : les éléments inclus, comme les galets d'un conglomérat, sont plus anciens que la roche qui les contient. La surface d'érosion traduit une émersion.</p>`,
q:[`Énoncez les principes de superposition et de recoupement.`,`Pourquoi la couche D est-elle forcément postérieure à la faille F ?`]},
{id:'discord',ch:'1.2',t:`Modélisation d'une discordance angulaire`,
obj:`Comprendre la succession d'événements qui conduit à une discordance.`,
mat:`Pâte à modeler de plusieurs couleurs (ou couches de sable humide colorées), couteau, planchette.`,
p:[`Superposer plusieurs couches horizontales de pâte à modeler.`,`Plisser ou basculer l'ensemble par une compression latérale.`,`Araser le sommet avec un couteau pour figurer l'érosion.`,`Déposer de nouvelles couches horizontales sur la surface arasée.`,`Réaliser une coupe verticale et observer.`],
r:`<p>Les nouvelles couches, horizontales, reposent sur les tranches des couches plissées : les pendages des deux ensembles sont différents.</p>`,
i:`<p>Une discordance angulaire enregistre : dépôt, déformation, émersion et érosion, puis nouvelle transgression. Elle marque une lacune dans l'enregistrement sédimentaire et permet de dater relativement la déformation, postérieure aux couches plissées et antérieure aux couches discordantes.</p>`,
q:[`Citez, dans l'ordre, les événements enregistrés par une discordance angulaire.`,`Comment dater relativement le plissement à l'aide de la discordance ?`]},
{id:'correl',ch:'1.2',t:`Identité paléontologique et corrélations`,
obj:`Mettre en correspondance des couches de régions éloignées grâce à leurs fossiles stratigraphiques.`,
mat:`Colonnes stratigraphiques de deux ou trois régions, avec leurs fossiles.`,
p:[`Repérer dans chaque colonne les fossiles stratigraphiques (ammonites, trilobites, nummulites…).`,`Relier les couches qui contiennent les mêmes fossiles stratigraphiques.`,`Identifier les lacunes et les variations d'épaisseur ou de faciès.`],
r:`<p>Des couches de faciès différents, calcaire dans une région et argile dans une autre, peuvent contenir le même fossile stratigraphique.</p>`,
i:`<p>Des couches renfermant les mêmes fossiles stratigraphiques ont le même âge : c'est le principe d'<b>identité paléontologique</b>. Un bon fossile stratigraphique a une courte durée d'existence et une large répartition géographique. Les corrélations fondent l'échelle stratigraphique.</p>`,
q:[`Quelles sont les qualités d'un bon fossile stratigraphique ?`,`Deux couches de faciès différents contiennent la même espèce d'ammonite : que peut-on conclure ?`]},
{id:'regleV',ch:'1.3',sim:'regleV',t:`Règle des V : affleurement d'une couche dans une vallée`,
obj:`Déduire le pendage d'une couche à partir de la forme de sa limite d'affleurement sur une carte.`,
mat:`Carte topographique ou maquette de vallée (polystyrène, pâte à modeler), feuille colorée figurant une couche.`,
p:[`Représenter une vallée par ses courbes de niveau.`,`Placer une couche horizontale, verticale, puis inclinée vers l'amont et vers l'aval.`,`Observer la forme de l'intersection entre la couche et la surface topographique.`],
r:`<p>Couche horizontale : limite parallèle aux courbes de niveau. Couche verticale : limite rectiligne. Couche inclinée vers l'amont : V pointant vers l'amont, plus ouvert que les courbes. Couche inclinée vers l'aval, plus que la pente de la vallée : V pointant vers l'aval.</p>`,
i:`<p>La forme de la limite d'affleurement dépend du pendage de la couche et de la topographie. La règle des V permet de lire sur une carte géologique le sens du pendage des couches.</p>`,
q:[`Comment reconnaître sur une carte une couche horizontale ? une couche verticale ?`,`Dans quel cas le V d'affleurement pointe-t-il vers l'aval ?`]},
{id:'coupe',ch:'1.3',t:`Réalisation d'une coupe géologique`,
obj:`Construire le profil topographique puis la coupe géologique selon un trait de coupe.`,
mat:`Carte géologique, papier millimétré, règle, crayons de couleur.`,
p:[`Tracer le trait de coupe AB sur la carte.`,`Reporter sur papier millimétré les intersections de AB avec les courbes de niveau et construire le profil topographique, en choisissant l'échelle des hauteurs.`,`Reporter les limites des couches sur le profil.`,`Tracer les couches selon leur pendage (données de la carte, règle des V), puis les failles.`,`Compléter par la légende, l'orientation et les échelles.`],
r:`<p>La coupe montre la disposition des couches en profondeur : horizontales, inclinées, plissées ou faillées.</p>`,
i:`<p>La carte géologique est une représentation en plan ; la coupe apporte la troisième dimension et permet de reconstituer l'histoire géologique de la région : sédimentation, déformations, érosion.</p>`,
q:[`Pourquoi faut-il choisir une échelle des hauteurs pour construire le profil topographique ?`,`Quelles informations la coupe apporte-t-elle que la carte ne montre pas directement ?`]},
{id:'racine',ch:'2.1',sim:'racine',t:`Absorption de l'eau par les racines`,
obj:`Montrer que la plante absorbe l'eau par ses racines et mesurer le volume absorbé.`,
mat:`Deux éprouvettes graduées, eau, huile, jeune plante (haricot, blé).`,
p:[`Placer les racines d'une plante dans une éprouvette graduée contenant de l'eau.`,`Recouvrir la surface de l'eau d'une fine couche d'huile pour empêcher l'évaporation.`,`Préparer une éprouvette témoin identique, sans plante.`,`Relever le volume d'eau chaque jour.`],
r:`<p>Le volume diminue dans l'éprouvette qui contient la plante ; il reste constant dans le témoin.</p>`,
i:`<p>La diminution du volume n'est due ni à l'évaporation (huile) ni à une autre cause (témoin) : l'eau est <b>absorbée par les racines</b>, puis conduite jusqu'aux feuilles, où l'essentiel est rejeté par transpiration.</p>`,
q:[`Quel est le rôle de la couche d'huile ? et celui de l'éprouvette témoin ?`,`Calculez le volume moyen d'eau absorbé par jour.`]},
{id:'poils',ch:'2.1',t:`Zone d'absorption : les poils absorbants`,
obj:`Localiser la zone de la racine qui absorbe l'eau et les sels minéraux.`,
mat:`Graines de radis ou de blé germées sur papier humide, loupe, microscope, huile.`,
p:[`Observer une jeune racine à la loupe et repérer ses zones : coiffe, zone de croissance, zone pilifère, zone subéreuse.`,`Plonger successivement différentes zones de la racine dans l'eau, le reste étant isolé par de l'huile.`,`Observer un poil absorbant au microscope.`],
r:`<p>La plante ne reste turgescente que si la zone pilifère plonge dans l'eau. Un poil absorbant est une cellule épidermique très allongée, à paroi mince et à grande vacuole.</p>`,
i:`<p>L'absorption se fait surtout au niveau de la <b>zone pilifère</b>. Les poils absorbants multiplient la surface de contact avec la solution du sol ; leur paroi mince et perméable facilite les échanges.</p>`,
q:[`Quelles caractéristiques du poil absorbant favorisent l'absorption ?`,`Pourquoi une plante repiquée sans précaution se fane-t-elle ?`]},
{id:'dutro',ch:'2.1',sim:'dutro',t:`L'osmomètre de Dutrochet`,
obj:`Mettre en évidence le phénomène d'osmose à travers une membrane semi-perméable.`,
mat:`Entonnoir fermé par une membrane semi-perméable (cellophane), tube capillaire, bécher, solution de saccharose, eau distillée.`,
p:[`Remplir l'entonnoir d'une solution de saccharose et le fermer par la membrane.`,`Le plonger dans un bécher d'eau distillée et repérer le niveau initial dans le tube.`,`Relever la hauteur du liquide dans le tube au cours du temps.`,`Faire varier les concentrations intérieure et extérieure.`],
r:`<p>Le niveau monte quand la solution intérieure est la plus concentrée, descend dans le cas inverse et ne varie pas si les concentrations sont égales.</p>`,
i:`<p>L'eau traverse la membrane semi-perméable du milieu le moins concentré (hypotonique) vers le milieu le plus concentré (hypertonique) : c'est l'<b>osmose</b>. La montée s'arrête quand la pression hydrostatique de la colonne compense la pression osmotique.</p>`,
q:[`Dans quel sens l'eau traverse-t-elle la membrane ? Justifiez.`,`Pourquoi le niveau finit-il par se stabiliser ?`]},
{id:'plasmo',ch:'2.1',sim:'plasmo',t:`Plasmolyse et turgescence`,
obj:`Observer le comportement de cellules végétales et animales placées dans des milieux de concentrations différentes.`,
mat:`Épiderme d'oignon rouge, sang (ou images de frottis), solutions de NaCl de concentrations variées, lames, lamelles, microscope.`,
p:[`Déposer un fragment d'épiderme d'oignon rouge dans une goutte d'eau distillée et l'observer au microscope.`,`Remplacer l'eau par une solution concentrée de NaCl, en l'aspirant avec du papier filtre, et observer.`,`Remettre la préparation dans l'eau distillée.`,`Refaire les observations avec des globules rouges.`],
r:`<p>Oignon : dans l'eau, la vacuole est volumineuse (turgescence) ; en solution concentrée, elle se rétracte et le cytoplasme se décolle de la paroi (plasmolyse) ; le retour dans l'eau entraîne la déplasmolyse. Globules rouges : éclatement en milieu très dilué (hémolyse), forme normale à 9 g/L, aspect ratatiné en milieu concentré (crénelure).</p>`,
i:`<p>La membrane plasmique se comporte comme une membrane semi-perméable : l'eau entre dans la cellule placée en milieu hypotonique et en sort en milieu hypertonique. La paroi pectocellulosique empêche l'éclatement de la cellule végétale ; la cellule animale, sans paroi, éclate. La concentration qui provoque la plasmolyse naissante permet d'estimer la pression osmotique du suc vacuolaire.</p>`,
q:[`Définissez la turgescence et la plasmolyse.`,`Pourquoi la cellule d'oignon n'éclate-t-elle pas dans l'eau distillée, contrairement au globule rouge ?`]},
{id:'posm',ch:'2.1',sim:'posm',t:`Calcul de la pression osmotique`,
obj:`Calculer et comparer les pressions osmotiques de deux solutions pour prévoir le sens des échanges d'eau.`,
mat:`Relation de Van 't Hoff : P = i × C × R × T.`,
p:[`Choisir le soluté et sa concentration massique (g/L).`,`Calculer la concentration molaire : C = Cm / M.`,`Appliquer P = i × C × R × T, avec i le nombre de particules libérées par molécule, R = 0,082 L·atm·K⁻¹·mol⁻¹ et T en kelvins.`,`Comparer les pressions des deux solutions.`],
r:`<p>À concentration molaire égale, NaCl (i = 2) exerce une pression osmotique double de celle du glucose (i = 1). Une solution de NaCl à 9 g/L et une solution de glucose à environ 55 g/L sont isotoniques.</p>`,
i:`<p>La pression osmotique dépend du nombre de particules dissoutes et non de leur nature. L'eau se déplace vers la solution de pression osmotique la plus élevée (hypertonique). Deux solutions de même pression osmotique sont isotoniques.</p>`,
q:[`Calculez la pression osmotique d'une solution de glucose à 18 g/L à 27 °C.`,`Comparez une solution de NaCl à 5,85 g/L et une solution de glucose à 18 g/L : laquelle est hypertonique ?`]},
{id:'ions',ch:'2.1',sim:'ions',t:`Absorption des ions : diffusion et transport actif`,
obj:`Montrer que certaines cellules accumulent des ions contre leur gradient de concentration, et que ce transport consomme de l'énergie.`,
mat:`Racines d'orge ou algue Nitella, solution de KCl, dispositif d'aération, inhibiteur respiratoire (KCN), dosage du K⁺.`,
p:[`Placer les racines dans une solution aérée de K⁺ à 1 mmol/L, à 25 °C.`,`Doser régulièrement le K⁺ dans les cellules.`,`Recommencer sans dioxygène, en présence de KCN, ou à 0 °C.`],
r:`<p>En conditions normales, la concentration de K⁺ dans les cellules dépasse largement celle du milieu. Sans O₂, avec du KCN ou à 0 °C, elle ne dépasse pas la concentration extérieure.</p>`,
i:`<p>Les ions peuvent entrer passivement, par <b>diffusion</b>, dans le sens de leur gradient. Leur accumulation contre le gradient est un <b>transport actif</b>, assuré par des protéines membranaires qui consomment l'ATP fourni par la respiration cellulaire ; il cesse quand la respiration est bloquée.</p>`,
q:[`Comparez la concentration du K⁺ dans les cellules et dans le milieu en conditions normales. Que concluez-vous ?`,`Pourquoi l'accumulation cesse-t-elle en l'absence de dioxygène ?`]},
{id:'elodee',ch:'2.2',sim:'elodee',t:`Dégagement de dioxygène par l'élodée`,
obj:`Mettre en évidence le rejet de dioxygène par une plante chlorophyllienne éclairée et étudier les facteurs qui l'influencent.`,
mat:`Élodée, bécher, entonnoir, tube à essai, lampe, hydrogénocarbonate de sodium (NaHCO₃), thermomètre, bûchette.`,
p:[`Placer des rameaux d'élodée sous un entonnoir renversé, dans un bécher d'eau enrichie en NaHCO₃ (source de CO₂).`,`Coiffer l'entonnoir d'un tube rempli d'eau.`,`Éclairer et compter les bulles dégagées par minute.`,`Faire varier l'éclairement, la température et la teneur en CO₂.`,`Tester le gaz recueilli avec une bûchette incandescente.`],
r:`<p>Le nombre de bulles augmente avec l'éclairement jusqu'à un palier ; il est très faible sans CO₂ et passe par un optimum de température. Le gaz rallume la bûchette incandescente.</p>`,
i:`<p>À la lumière, la plante verte absorbe du CO₂ et rejette du <b>dioxygène</b> : ce sont les échanges gazeux chlorophylliens. Leur intensité dépend de <b>facteurs limitants</b> : lumière, CO₂, température.</p>`,
q:[`Décrivez l'évolution du nombre de bulles en fonction de l'éclairement et identifiez le facteur limitant sur chaque partie de la courbe.`,`Quel est le rôle de l'hydrogénocarbonate de sodium ?`]},
{id:'exao',ch:'2.2',sim:'exao',t:`Mesure des échanges gazeux par ExAO`,
obj:`Suivre en continu la teneur en O₂ ou en CO₂ d'une suspension d'algues, à la lumière et à l'obscurité.`,
mat:`Chaîne ExAO : sonde à O₂ (ou à CO₂), enceinte agitée, suspension de chlorelles, lampe, ordinateur.`,
p:[`Placer la suspension de chlorelles dans l'enceinte et lancer l'enregistrement.`,`Alterner des périodes d'éclairement et d'obscurité.`,`Mesurer la pente de la courbe dans chaque période.`],
r:`<p>À la lumière, la teneur en O₂ augmente et celle en CO₂ diminue ; à l'obscurité, c'est l'inverse.</p>`,
i:`<p>À la lumière, la production d'O₂ par la photosynthèse dépasse sa consommation par la respiration : on mesure une <b>photosynthèse nette</b>. À l'obscurité, seule la respiration a lieu. Photosynthèse brute = photosynthèse nette + respiration.</p>`,
q:[`Calculez la vitesse de production nette d'O₂ à la lumière et la vitesse de consommation à l'obscurité.`,`Pourquoi parle-t-on de photosynthèse « nette » ? Comment obtenir la photosynthèse brute ?`]},
{id:'bbt',ch:'2.2',sim:'bbt',t:`Absorption du CO₂ : test au bleu de bromothymol`,
obj:`Montrer que la plante absorbe du CO₂ à la lumière et en rejette à l'obscurité.`,
mat:`Quatre tubes, bleu de bromothymol (BBT) vert, élodée, escargot aquatique, papier noir, lampe.`,
p:[`Remplir quatre tubes de BBT vert (neutre).`,`Tube 1 : élodée à la lumière ; tube 2 : élodée à l'obscurité ; tube 3 : BBT seul à la lumière ; tube 4 : escargot à la lumière.`,`Attendre deux heures et observer la couleur des tubes.`],
r:`<p>Tube 1 bleu, tube 2 jaune, tube 3 vert, tube 4 jaune.</p>`,
i:`<p>Le bleuissement du tube 1 montre que l'élodée éclairée <b>absorbe du CO₂</b>. À l'obscurité, la plante respire et rejette du CO₂ (tube 2), comme l'escargot (tube 4). Le tube 3 montre que la lumière seule ne modifie pas l'indicateur.</p>`,
q:[`Expliquez le changement de couleur de chaque tube.`,`Quel est le rôle du tube 3 ?`]},
{id:'stom',ch:'2.2',sim:'stom',t:`Observation des stomates`,
obj:`Identifier les structures qui assurent les échanges gazeux entre la feuille et l'atmosphère.`,
mat:`Feuille de poireau ou de géranium, pince, lame, lamelle, eau, microscope.`,
p:[`Prélever un fragment d'épiderme inférieur de la feuille.`,`Le monter entre lame et lamelle dans une goutte d'eau.`,`Observer au microscope, à faible puis à fort grossissement.`,`Comparer des feuilles éclairées et des feuilles placées à l'obscurité.`],
r:`<p>L'épiderme porte de nombreux stomates, formés de deux cellules de garde riches en chloroplastes qui délimitent un orifice, l'ostiole. L'ostiole est ouvert à la lumière, fermé à l'obscurité ou en cas de manque d'eau.</p>`,
i:`<p>Les stomates sont les lieux des échanges gazeux : entrée du CO₂, sortie du O₂ et de la vapeur d'eau. L'ouverture résulte de la turgescence des cellules de garde ; la fermeture limite les pertes d'eau, mais aussi l'entrée du CO₂.</p>`,
q:[`Sur quelle face de la feuille les stomates sont-ils les plus nombreux ? Quel en est l'intérêt ?`,`Expliquez comment la fermeture des stomates peut limiter la photosynthèse en période de sécheresse.`]},
{id:'amidon',ch:'2.3',sim:'amidon',t:`Synthèse d'amidon à la lumière (expériences de Sachs)`,
obj:`Montrer que la synthèse de matière organique (amidon) nécessite la lumière, la chlorophylle et le CO₂.`,
mat:`Plante en pot (pélargonium, feuille panachée), papier aluminium (cache), flacon de potasse, alcool bouillant au bain-marie, eau iodée.`,
p:[`Placer la plante 48 h à l'obscurité pour épuiser ses réserves d'amidon.`,`Selon l'expérience : couvrir une partie d'une feuille d'un cache, utiliser une feuille panachée, ou enfermer une feuille dans un flacon contenant de la potasse, qui absorbe le CO₂.`,`Éclairer la plante pendant plusieurs heures.`,`Décolorer les feuilles dans l'alcool bouillant, au bain-marie.`,`Les plonger dans l'eau iodée.`],
r:`<p>Seules les zones éclairées, chlorophylliennes et en présence de CO₂ se colorent en bleu-noir.</p>`,
i:`<p>L'eau iodée colore l'amidon en bleu-noir. La synthèse d'amidon exige la <b>lumière</b>, la <b>chlorophylle</b> et le <b>CO₂</b> : la plante chlorophyllienne est autotrophe. Bilan : 6 CO₂ + 12 H₂O → C₆H₁₂O₆ + 6 O₂ + 6 H₂O (énergie lumineuse, chlorophylle).</p>`,
q:[`Pourquoi place-t-on la plante 48 h à l'obscurité avant l'expérience ?`,`Dégagez les trois conditions nécessaires à la synthèse d'amidon.`]},
{id:'extract',ch:'2.4',t:`Extraction des pigments et fluorescence`,
obj:`Extraire les pigments de la feuille et observer leurs propriétés optiques.`,
mat:`Feuilles d'épinard, mortier, sable, alcool à 90° ou acétone, papier filtre, tube, lampe puissante.`,
p:[`Broyer les feuilles avec un peu de sable et d'alcool.`,`Filtrer : on obtient la solution de chlorophylle brute.`,`Observer la solution par transparence, puis par réflexion sur fond noir, éclairée par une lumière intense.`],
r:`<p>Par transparence, la solution est verte ; par réflexion, elle apparaît rouge sombre.</p>`,
i:`<p>La lueur rouge, ou <b>fluorescence</b>, montre que les pigments absorbent l'énergie lumineuse : extraits de la cellule, ils en réémettent une partie sous forme de lumière rouge. Dans le chloroplaste, cette énergie est au contraire convertie en énergie chimique.</p>`,
q:[`Pourquoi broie-t-on les feuilles avec de l'alcool ?`,`Que traduit la fluorescence rouge de la chlorophylle brute ?`]},
{id:'chromato',ch:'2.4',sim:'chromato',t:`Séparation des pigments par chromatographie`,
obj:`Séparer et identifier les pigments de la chlorophylle brute.`,
mat:`Bande de papier Whatman, chlorophylle brute, solvant (éther de pétrole et acétone), éprouvette bouchée, capillaire.`,
p:[`Déposer une goutte de chlorophylle brute à 2 cm du bas du papier ; sécher et recommencer plusieurs fois.`,`Placer le papier dans l'éprouvette contenant le solvant, sans immerger le dépôt.`,`Laisser migrer, puis retirer le papier quand le front du solvant approche du haut ; marquer le front.`,`Mesurer les distances et calculer les Rf.`],
r:`<p>Quatre bandes : carotènes (orangé, en haut), xanthophylles (jaune), chlorophylle a (vert-bleu), chlorophylle b (vert-jaune).</p>`,
i:`<p>Chaque pigment migre à une vitesse qui dépend de sa solubilité dans le solvant et de sa fixation sur le papier. Rf = distance parcourue par le pigment / distance parcourue par le solvant. La chlorophylle brute est un mélange de <b>chlorophylles</b> (a et b) et de <b>caroténoïdes</b> (carotènes, xanthophylles).</p>`,
q:[`Calculez le Rf de chaque pigment.`,`Pourquoi la chlorophylle b migre-t-elle moins loin que les carotènes ?`]},
{id:'spectre',ch:'2.4',sim:'spectre',t:`Spectre d'absorption des pigments`,
obj:`Déterminer les radiations lumineuses absorbées par les pigments chlorophylliens.`,
mat:`Spectroscope ou spectrophotomètre, source de lumière blanche, cuve contenant la solution de pigments.`,
p:[`Observer le spectre de la lumière blanche au spectroscope.`,`Interposer la solution de chlorophylle brute et repérer les bandes sombres.`,`Mesurer l'absorbance de chaque pigment pour différentes longueurs d'onde au spectrophotomètre.`],
r:`<p>Les chlorophylles absorbent surtout le bleu-violet (430 à 450 nm) et le rouge (640 à 680 nm) et très peu le vert. Les caroténoïdes absorbent le bleu et le bleu-vert (400 à 500 nm).</p>`,
i:`<p>Les radiations vertes, peu absorbées, sont transmises ou réfléchies : d'où la couleur verte des feuilles. Seules les radiations absorbées peuvent être utilisées par la photosynthèse.</p>`,
q:[`Quelles radiations sont les plus absorbées par la chlorophylle brute ?`,`Expliquez pourquoi les feuilles sont vertes.`]},
{id:'engel',ch:'2.4',sim:'engel',t:`Expérience d'Engelmann : le spectre d'action`,
obj:`Identifier les radiations efficaces pour la photosynthèse.`,
mat:`Algue filamenteuse (Cladophora ou spirogyre), bactéries aérobies mobiles, prisme, microscope.`,
p:[`Placer le filament d'algue dans une goutte d'eau contenant des bactéries aérobies, à l'abri du dioxygène de l'air.`,`Éclairer le filament avec un spectre obtenu à l'aide d'un prisme.`,`Observer la répartition des bactéries le long du filament.`],
r:`<p>Les bactéries s'accumulent autour des zones éclairées en bleu-violet et en rouge ; elles sont rares dans le vert.</p>`,
i:`<p>Les bactéries aérobies se rassemblent là où le dioxygène est le plus abondant, c'est-à-dire là où la photosynthèse est la plus intense. Le <b>spectre d'action</b> coïncide avec le <b>spectre d'absorption</b> des chlorophylles : ce sont les radiations absorbées par ces pigments qui sont utilisées.</p>`,
q:[`Pourquoi utilise-t-on des bactéries aérobies ?`,`Comparez la répartition des bactéries au spectre d'absorption des chlorophylles. Concluez.`]},
{id:'hill',ch:'2.5',sim:'hill',t:`Expérience de Hill (1937)`,
obj:`Montrer que le dégagement d'O₂ est lié à l'oxydation de l'eau à la lumière et qu'il ne dépend pas du CO₂.`,
mat:`Suspension de chloroplastes isolés dans un milieu sans CO₂, réactif de Hill (accepteur d'électrons : ions ferriques Fe³⁺), sonde à O₂, lampe.`,
p:[`Placer la suspension de chloroplastes dans l'enceinte, sans CO₂.`,`Mesurer la teneur en O₂ à l'obscurité puis à la lumière.`,`Ajouter le réactif de Hill et mesurer de nouveau à la lumière.`],
r:`<p>Le dégagement d'O₂ n'a lieu qu'en présence de lumière et d'un accepteur d'électrons ; les ions Fe³⁺ sont alors réduits en Fe²⁺.</p>`,
i:`<p>À la lumière, les chloroplastes oxydent l'eau (<b>photolyse</b>) : 2 H₂O → O₂ + 4 H⁺ + 4 e⁻. Les électrons sont cédés à un accepteur : Fe³⁺ in vitro, NADP⁺ dans la cellule, qui devient NADPH,H⁺. Le dégagement d'O₂ ne nécessite pas de CO₂.</p>`,
q:[`Quelles conditions sont nécessaires au dégagement d'O₂ par des chloroplastes isolés ?`,`Quel est le rôle du réactif de Hill ? Quelle molécule joue ce rôle dans la cellule ?`]},
{id:'ruben',ch:'2.5',sim:'ruben',t:`Origine du dioxygène : Ruben et Kamen (1941)`,
obj:`Déterminer si le dioxygène dégagé provient de l'eau ou du CO₂.`,
mat:`Deux suspensions de chlorelles, eau marquée H₂¹⁸O, CO₂ marqué C¹⁸O₂ (sous forme d'hydrogénocarbonate), spectromètre de masse.`,
p:[`Lot 1 : chlorelles dans H₂¹⁸O avec du CO₂ ordinaire.`,`Lot 2 : chlorelles dans de l'eau ordinaire avec du C¹⁸O₂.`,`Éclairer et analyser le dioxygène dégagé au spectromètre de masse.`],
r:`<p>Le dioxygène dégagé est marqué (¹⁸O₂) seulement dans le lot 1.</p>`,
i:`<p>Le dioxygène rejeté par la photosynthèse provient de la <b>photolyse de l'eau</b>, et non du CO₂. L'oxygène du CO₂ se retrouve dans la matière organique et dans l'eau formée.</p>`,
q:[`D'où provient le dioxygène rejeté par la photosynthèse ? Justifiez.`,`Que devient l'oxygène du CO₂ ?`]},
{id:'calvin',ch:'2.5',sim:'calvin',t:`Cycle de Calvin : marquage au ¹⁴CO₂`,
obj:`Identifier la première molécule organique formée et les étapes de la fixation du CO₂.`,
mat:`Suspension de chlorelles, ¹⁴CO₂ radioactif, alcool bouillant, chromatographie bidimensionnelle, autoradiographie.`,
p:[`Éclairer les chlorelles et leur fournir du ¹⁴CO₂.`,`Tuer les algues dans l'alcool bouillant après des durées croissantes (quelques secondes à quelques minutes).`,`Séparer les molécules par chromatographie bidimensionnelle et repérer les molécules radioactives par autoradiographie.`,`Suivre les teneurs en APG et en RuBP lors du passage à l'obscurité ou d'une baisse du CO₂.`],
r:`<p>Après 2 s, la radioactivité est surtout dans l'APG ; apparaissent ensuite les trioses phosphates, les hexoses phosphates, le RuBP, le saccharose et les acides aminés. À l'obscurité, l'APG augmente et le RuBP diminue ; sans CO₂, c'est l'inverse.</p>`,
i:`<p>Le CO₂ est fixé sur le <b>RuBP</b> (C5) par la Rubisco, ce qui forme deux molécules d'<b>APG</b> (C3). L'APG est réduit en triose phosphate grâce à l'ATP et au NADPH,H⁺ produits à la lumière ; une partie des trioses régénère le RuBP, le reste forme les glucides. À l'obscurité, faute d'ATP et de NADPH,H⁺, l'APG n'est plus réduit et s'accumule, tandis que le RuBP n'est plus régénéré.</p>`,
q:[`Quelle est la première molécule organique stable marquée ? Justifiez.`,`Expliquez l'accumulation de l'APG à l'obscurité.`]},
{id:'arnon',ch:'2.5',sim:'arnon',t:`Expérience d'Arnon : phase claire et phase sombre`,
obj:`Montrer que la fixation du CO₂ utilise des composés produits à la lumière.`,
mat:`Chloroplastes isolés, ¹⁴CO₂, source lumineuse, compteur de radioactivité.`,
p:[`Éclairer des chloroplastes en l'absence de CO₂.`,`Les placer ensuite à l'obscurité en présence de ¹⁴CO₂.`,`Mesurer la radioactivité incorporée dans la matière organique.`,`Comparer avec des chloroplastes non éclairés au préalable.`],
r:`<p>Après un éclairement préalable, du ¹⁴CO₂ est fixé à l'obscurité pendant une courte durée, puis la fixation s'arrête. Sans éclairement préalable, il n'y a aucune fixation.</p>`,
i:`<p>La photosynthèse comporte deux phases : la <b>phase photochimique</b> (claire), qui produit ATP et NADPH,H⁺ dans les thylakoïdes, et la <b>phase non photochimique</b> (sombre, cycle de Calvin), qui utilise ces composés pour réduire le CO₂ dans le stroma. La fixation s'arrête quand le stock d'ATP et de NADPH,H⁺ est épuisé.</p>`,
q:[`Pourquoi la fixation du CO₂ s'arrête-t-elle après quelques minutes d'obscurité ?`,`Montrez que cette expérience prouve l'existence de deux phases dans la photosynthèse.`]},
{id:'jagen',ch:'2.5',t:`Expérience de Jagendorf : gradient de protons et ATP`,
obj:`Montrer que la synthèse d'ATP est couplée à un gradient de protons de part et d'autre de la membrane des thylakoïdes.`,
mat:`Thylakoïdes isolés, tampons à pH 4 et à pH 8, ADP, phosphate inorganique (Pi), obscurité.`,
p:[`Placer des thylakoïdes dans un milieu à pH 4 jusqu'à équilibre : l'intérieur des thylakoïdes devient acide.`,`Les transférer, à l'obscurité, dans un milieu à pH 8 contenant ADP et Pi.`,`Doser l'ATP formé.`,`Témoin : transfert dans un milieu à pH 4, sans différence de pH.`],
r:`<p>De l'ATP est produit à l'obscurité uniquement lorsqu'il existe une différence de pH entre l'intérieur et l'extérieur des thylakoïdes.</p>`,
i:`<p>Le retour des protons de l'intérieur du thylakoïde vers le stroma, à travers l'<b>ATP synthase</b>, fournit l'énergie de la phosphorylation : ADP + Pi → ATP. À la lumière, ce gradient est créé par la photolyse de l'eau et le transfert des électrons.</p>`,
q:[`Pourquoi l'expérience est-elle réalisée à l'obscurité ?`,`Quel est le rôle de l'ATP synthase ?`]},
{id:'pancreas',ch:'3.1',sim:'pancreas',t:`Ablation et greffe du pancréas`,
obj:`Montrer le rôle du pancréas dans la régulation de la glycémie et le mode d'action hormonal de ce contrôle.`,
mat:`Données historiques (Von Mering et Minkowski, 1889 ; Hédon), dosages de la glycémie et de la glycosurie.`,
p:[`Mesurer la glycémie d'un chien normal.`,`Pratiquer l'ablation totale du pancréas et suivre la glycémie.`,`Greffer un fragment de pancréas sous la peau, sans connexion nerveuse, puis retirer le greffon.`,`Chez un autre animal privé de pancréas, injecter de l'insuline.`],
r:`<p>L'ablation entraîne une hyperglycémie (plus de 3 g/L), une glycosurie, une polyurie, une soif intense et un amaigrissement. La greffe ou les injections d'insuline rétablissent une glycémie normale ; le retrait du greffon fait réapparaître l'hyperglycémie.</p>`,
i:`<p>Le pancréas est indispensable au maintien de la glycémie autour de 1 g/L. Le greffon, sans connexion nerveuse, agit par voie sanguine : il sécrète une <b>hormone hypoglycémiante, l'insuline</b>. Au-delà du seuil rénal (environ 1,8 g/L), le glucose passe dans l'urine.</p>`,
q:[`Relevez les symptômes observés après l'ablation du pancréas.`,`Montrez que le pancréas agit par voie sanguine.`]},
{id:'ligature',ch:'3.1',t:`Ligature du canal pancréatique`,
obj:`Déterminer quelles structures du pancréas interviennent dans la régulation de la glycémie.`,
mat:`Données expérimentales, coupes histologiques de pancréas.`,
p:[`Ligaturer le canal pancréatique d'un animal.`,`Suivre la digestion et la glycémie.`,`Observer au microscope une coupe du pancréas quelques semaines plus tard.`],
r:`<p>Troubles digestifs, car le suc pancréatique n'atteint plus l'intestin, mais glycémie normale. Les acini dégénèrent ; les îlots de Langerhans restent intacts.</p>`,
i:`<p>Le pancréas a une double fonction : <b>exocrine</b> (suc pancréatique produit par les acini) et <b>endocrine</b> (hormones). Les îlots de Langerhans contrôlent la glycémie : les cellules β sécrètent l'insuline, hypoglycémiante, et les cellules α le glucagon, hyperglycémiant.</p>`,
q:[`Quelles sont les deux fonctions du pancréas ?`,`Que prouve l'absence de diabète après la ligature du canal pancréatique ?`]},
{id:'hgpo',ch:'3.1',sim:'hgpo',t:`Test d'hyperglycémie provoquée par voie orale`,
obj:`Comparer la régulation de la glycémie chez une personne saine et chez une personne diabétique.`,
mat:`Sujets à jeun, 75 g de glucose dissous dans l'eau, lecteur de glycémie, dosages de l'insulinémie.`,
p:[`Mesurer la glycémie à jeun.`,`Faire ingérer 75 g de glucose.`,`Mesurer la glycémie et l'insulinémie toutes les 30 minutes pendant 3 heures.`],
r:`<p>Sujet sain : glycémie à jeun proche de 0,9 g/L, pic modéré puis retour à la normale en 2 à 3 heures, avec une forte hausse de l'insulinémie. Sujet diabétique de type 1 : glycémie élevée à jeun, forte hyperglycémie qui persiste, insulinémie très faible.</p>`,
i:`<p>Chez le sujet sain, l'élévation de la glycémie stimule la sécrétion d'insuline, qui favorise l'utilisation du glucose et son stockage (glycogène du foie et des muscles) : la glycémie revient à sa valeur de référence. Chez le diabétique de type 1, l'absence d'insuline empêche cette régulation. On parle de diabète quand la glycémie à jeun atteint ou dépasse 1,26 g/L.</p>`,
q:[`Comparez l'évolution de la glycémie et de l'insulinémie chez les deux sujets.`,`Expliquez l'origine de l'hyperglycémie chez le diabétique de type 1.`]},
{id:'foie',ch:'3.1',sim:'foie',t:`Expérience du foie lavé (Claude Bernard, 1855)`,
obj:`Montrer que le foie stocke le glucose sous forme de glycogène et le libère dans le sang.`,
mat:`Foie frais d'un animal bien nourri, eau, liqueur de Fehling, eau iodée.`,
p:[`Laver le foie par un courant d'eau injecté par la veine porte.`,`Tester le glucose dans l'eau de lavage à la liqueur de Fehling jusqu'à sa disparition.`,`Laisser le foie plusieurs heures à température ambiante.`,`Laver de nouveau et tester l'eau de lavage.`],
r:`<p>Le glucose disparaît de l'eau de lavage, puis réapparaît après quelques heures. Un fragment de foie se colore en brun acajou à l'eau iodée, ce qui révèle le glycogène.</p>`,
i:`<p>Le foie contient une réserve de <b>glycogène</b> qu'il hydrolyse en glucose (glycogénolyse) et libère dans le sang : c'est la <b>fonction glycogénique</b> du foie, qui intervient dans le maintien de la glycémie. Le stockage (glycogénogenèse) est stimulé par l'insuline, la libération par le glucagon.</p>`,
q:[`Pourquoi le glucose disparaît-il de l'eau de lavage ?`,`D'où provient le glucose qui réapparaît après 24 h ?`]},
{id:'fehling',ch:'3.1',t:`Tests d'identification : liqueur de Fehling et eau iodée`,
obj:`Maîtriser les tests utilisés dans les expériences sur la glycémie.`,
mat:`Liqueur de Fehling, solutions de glucose et d'amidon, fragment de foie, eau iodée, tubes à essai, bec Bunsen.`,
p:[`Ajouter de la liqueur de Fehling à une solution de glucose, puis chauffer.`,`Faire de même avec de l'eau distillée : c'est le témoin.`,`Déposer de l'eau iodée sur un fragment de foie et sur de l'amidon.`],
r:`<p>Glucose et Fehling à chaud : précipité rouge brique ; le témoin reste bleu. Glycogène et eau iodée : brun acajou ; amidon et eau iodée : bleu-noir.</p>`,
i:`<p>Le glucose est un <b>sucre réducteur</b> : il réduit les ions cuivriques Cu²⁺ (bleus) en oxyde cuivreux Cu₂O (rouge brique). Ces tests qualitatifs permettent de détecter la glycosurie et les réserves glucidiques.</p>`,
q:[`Quel est le rôle du tube témoin ?`,`Comment mettre en évidence la glycosurie chez un chien privé de pancréas ?`]},
{id:'reflexe',ch:'3.2',t:`Le réflexe myotatique (réflexe rotulien)`,
obj:`Identifier les éléments d'un arc réflexe.`,
mat:`Marteau à réflexes, élève assis, jambes pendantes.`,
p:[`Frapper légèrement le tendon rotulien, sous la rotule.`,`Observer la réponse.`,`Recommencer en demandant au sujet de concentrer son attention ailleurs, par exemple en serrant les mains.`],
r:`<p>Extension brusque et involontaire de la jambe, due à la contraction du quadriceps, suivie d'un retour à la position initiale.</p>`,
i:`<p>Le choc étire le quadriceps ; les <b>fuseaux neuromusculaires</b> (récepteurs) produisent un message nerveux conduit par la fibre sensitive jusqu'à la <b>moelle épinière</b> (centre nerveux), où il est transmis au motoneurone ; le message moteur provoque la contraction du muscle étiré (effecteur). Le réflexe myotatique est la contraction d'un muscle en réponse à son propre étirement : il est involontaire, rapide et inné.</p>`,
q:[`Identifiez les éléments de l'arc réflexe mis en jeu.`,`Quel est le stimulus efficace du réflexe myotatique ?`]},
{id:'grenouille',ch:'3.2',t:`Grenouille spinale et rôle de la moelle épinière`,
obj:`Montrer que la moelle épinière est le centre nerveux de certains réflexes.`,
mat:`Documents sur la grenouille spinale, acide acétique dilué, eau.`,
p:[`Grenouille privée d'encéphale (spinale) et suspendue : tremper une patte dans l'acide dilué.`,`Recommencer après destruction de la moelle épinière.`,`Recommencer après section du nerf sciatique.`],
r:`<p>La grenouille spinale retire sa patte ; après destruction de la moelle ou section du nerf, il n'y a plus de réponse.</p>`,
i:`<p>L'encéphale n'est pas nécessaire à ce réflexe ; la <b>moelle épinière</b> en est le centre nerveux. L'arc réflexe comprend : récepteur (peau), voie sensitive, centre (moelle), voie motrice, effecteur (muscles). Le nerf, qui contient les voies sensitive et motrice, est indispensable.</p>`,
q:[`Pourquoi utilise-t-on une grenouille spinale ?`,`Que montre la disparition du réflexe après destruction de la moelle épinière ?`]},
{id:'magendie',ch:'3.2',sim:'magendie',t:`Section des racines rachidiennes (Magendie)`,
obj:`Déterminer le rôle des racines dorsale et ventrale du nerf rachidien.`,
mat:`Données expérimentales sur l'animal, schéma de la moelle épinière et des racines.`,
p:[`Sectionner la racine dorsale ou la racine ventrale d'un nerf rachidien et observer le territoire innervé.`,`Stimuler le bout central (côté moelle), puis le bout périphérique de la racine sectionnée.`],
r:`<p>Racine dorsale sectionnée : perte de la sensibilité ; réponse seulement si l'on stimule le bout central. Racine ventrale sectionnée : paralysie ; contraction seulement si l'on stimule le bout périphérique.</p>`,
i:`<p>La racine dorsale est <b>sensitive</b> : elle conduit le message nerveux de la périphérie vers la moelle (sens centripète). La racine ventrale est <b>motrice</b> : elle conduit le message de la moelle vers les muscles (sens centrifuge). Le nerf rachidien est donc un nerf <b>mixte</b>.</p>`,
q:[`Quel est le rôle de la racine dorsale ? de la racine ventrale ?`,`Pourquoi qualifie-t-on le nerf rachidien de nerf mixte ?`]},
{id:'waller',ch:'3.2',t:`Dégénérescence wallérienne`,
obj:`Localiser les corps cellulaires des neurones sensitifs et moteurs.`,
mat:`Données expérimentales et coupes histologiques.`,
p:[`Sectionner la racine dorsale entre le ganglion rachidien et la moelle, puis observer après quelques jours.`,`Sectionner la racine dorsale au-delà du ganglion, côté nerf.`,`Sectionner la racine ventrale.`],
r:`<div class="scroll"><table class="t"><thead><tr><th>Section</th><th>Partie qui dégénère</th></tr></thead><tbody><tr><td>Racine dorsale, entre ganglion et moelle</td><td>Segment relié à la moelle</td></tr><tr><td>Racine dorsale, au-delà du ganglion</td><td>Segment périphérique</td></tr><tr><td>Racine ventrale</td><td>Segment périphérique</td></tr></tbody></table></div>`,
i:`<p>Une fibre nerveuse séparée de son corps cellulaire dégénère. Les corps cellulaires des neurones sensitifs se trouvent donc dans le <b>ganglion rachidien</b>, ceux des neurones moteurs dans la <b>substance grise</b> (cornes antérieures) de la moelle épinière.</p>`,
q:[`Où se trouvent les corps cellulaires des neurones sensitifs ? des neurones moteurs ?`,`Pourquoi une fibre séparée de son corps cellulaire dégénère-t-elle ?`]},
{id:'potent',ch:'3.2',sim:'potent',t:`Potentiel de repos et potentiel d'action`,
obj:`Caractériser le message nerveux et comparer la réponse d'une fibre isolée à celle d'un nerf.`,
mat:`Nerf sciatique de grenouille ou fibre géante de calmar, stimulateur, électrodes, oscilloscope ou ExAO.`,
p:[`Placer une microélectrode dans la fibre et une électrode de référence à l'extérieur : lire le potentiel de repos.`,`Appliquer des stimulations d'intensité croissante.`,`Enregistrer les réponses d'une fibre isolée, puis d'un nerf entier.`],
r:`<p>Au repos, la face interne de la membrane est négative, vers −70 mV. Fibre : aucune réponse sous le seuil ; au-delà, un potentiel d'action d'amplitude constante, environ 100 mV. Nerf : l'amplitude de la réponse augmente avec l'intensité, entre un seuil et un maximum.</p>`,
i:`<p>Le potentiel d'action est une inversion brève et locale de la polarisation de la membrane : dépolarisation, repolarisation, hyperpolarisation. La fibre obéit à la <b>loi du tout ou rien</b>. Le nerf est formé de nombreuses fibres de seuils différents : une intensité croissante <b>recrute</b> un nombre croissant de fibres, d'où une réponse globale graduée.</p>`,
q:[`Comparez la réponse d'une fibre isolée et celle d'un nerf à des stimulations d'intensité croissante.`,`Décrivez les phases du potentiel d'action.`]},
{id:'vitesse',ch:'3.2',sim:'vitesse',t:`Vitesse de propagation du message nerveux`,
obj:`Calculer la vitesse de propagation du message nerveux le long d'un nerf.`,
mat:`Nerf sciatique, stimulateur, deux électrodes réceptrices à des distances différentes, oscilloscope.`,
p:[`Stimuler le nerf et enregistrer la réponse sur deux électrodes R₁ et R₂, situées à des distances d₁ et d₂ du point de stimulation.`,`Mesurer les temps de latence t₁ et t₂.`,`Calculer v = (d₂ − d₁) / (t₂ − t₁).`],
r:`<p>La réponse apparaît plus tard sur l'électrode la plus éloignée du point de stimulation.</p>`,
i:`<p>Le message nerveux se propage le long des fibres à vitesse constante. La vitesse est plus élevée dans les fibres de gros diamètre et dans les fibres myélinisées, où la conduction est saltatoire.</p>`,
q:[`Calculez la vitesse de propagation à partir des données.`,`Pourquoi utilise-t-on la différence de deux latences plutôt qu'une seule latence ?`]},
{id:'synapse',ch:'3.2',t:`Transmission synaptique : action du curare`,
obj:`Montrer que la transmission du message du nerf au muscle se fait au niveau d'une synapse neuromusculaire.`,
mat:`Préparation nerf-muscle de grenouille, curare, stimulateur.`,
p:[`Stimuler le nerf et observer le muscle.`,`Placer la préparation dans une solution de curare.`,`Stimuler le nerf, puis stimuler directement le muscle.`],
r:`<p>Après action du curare, la stimulation du nerf ne provoque plus de contraction, mais la stimulation directe du muscle en provoque une. Le nerf conduit toujours le message.</p>`,
i:`<p>Le curare agit au niveau de la <b>jonction neuromusculaire</b> : il se fixe sur les récepteurs à l'acétylcholine de la membrane du muscle et bloque la transmission. Celle-ci est chimique : un neurotransmetteur, l'<b>acétylcholine</b>, libéré par la terminaison nerveuse, se fixe sur des récepteurs spécifiques de la membrane postsynaptique.</p>`,
q:[`Où le curare agit-il ? Justifiez à l'aide des résultats.`,`Pourquoi dit-on que la transmission neuromusculaire est chimique ?`]}
];

/* ---------- Application ---------- */
const $=s=>document.querySelector(s),html=document.documentElement;
let cur=-1;
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const chNum=e=>Object.keys(CH).filter(k=>k[0]==e.ch[0]).indexOf(e.ch)+1;
function drawNav(){const f=norm($('#q').value.trim());let s='',lu='',lc='';
 EXP.forEach((e,i)=>{if(f&&!norm(e.t+' '+CH[e.ch]).includes(f))return;const u=e.ch[0];
  if(u!=lu){s+=`<p class="uh" style="--uc:${UN[u][1]}">Unité ${u}<br><span>${UN[u][0]}</span></p>`;lu=u;lc=''}
  if(e.ch!=lc){s+=`<p class="ch">${CH[e.ch]}</p>`;lc=e.ch}
  s+=`<button type="button" class="it" style="--uc:${UN[u][1]}" data-i="${i}"${i==cur?' aria-current="page"':''}><i class="dot${e.sim?'':' st'}"></i><span>${e.t}</span></button>`});
 $('#nav').innerHTML=s||`<p class="ch">Aucune expérience ne correspond à cette recherche.</p>`}
const rv=(t,b)=>`<section class="reveal"><button type="button" class="rv" aria-expanded="false">${t}</button><div class="rvb" hidden>${b}</div></section>`;
function show(i){cleanup();cur=i;const e=EXP[i],u=e.ch[0],M=$('#main'),pv=EXP[i-1],nx=EXP[i+1];M.style.setProperty('--uc',UN[u][1]);
 M.innerHTML=`<p class="crumb">Unité ${u}, chapitre ${chNum(e)} : ${CH[e.ch]}</p><h1>${e.t}</h1><p class="obj"><b>Objectif.</b> ${e.obj}</p>
 <div class="lay"><section class="proto"><h2>Matériel</h2><p>${e.mat}</p><h2>Protocole</h2><ol>${e.p.map(x=>`<li>${x}</li>`).join('')}</ol></section>${e.sim?`<section class="bench" aria-label="Simulation"><h2>Simulation</h2><div class="sim"></div></section>`:''}</div>
 ${rv('Résultats',e.r)}${rv('Interprétation et conclusion',e.i)}
 <section class="qs"><h2>Questions pour la classe</h2><ol>${e.q.map(x=>`<li>${x}</li>`).join('')}</ol></section>
 <nav class="pn" aria-label="Expériences voisines">${pv?`<a class="b ghost" href="#${pv.id}"><span>Précédente</span>${pv.t}</a>`:'<i></i>'}${nx?`<a class="b ghost" href="#${nx.id}" style="text-align:right"><span>Suivante</span>${nx.t}</a>`:''}</nav>`;
 if(e.sim){const el=M.querySelector('.sim');try{SIMS[e.sim](el)}catch(err){el.innerHTML=`<p>La simulation n'a pas pu démarrer. Rechargez la page.</p>`;console.error(err)}}
 document.title=e.t+' | Laboratoire virtuel SVT';drawNav();window.scrollTo(0,0)}
function home(){cleanup();cur=-1;const M=$('#main');M.style.removeProperty('--uc');
 const nS=EXP.filter(e=>e.sim).length;
 M.innerHTML=`<section class="hero"><h1>Laboratoire virtuel de SVT</h1><p class="lead">Les ${EXP.length} expériences du programme de 1<sup>re</sup> année du baccalauréat, Sciences expérimentales, à projeter pendant la séance, dont ${nS} simulations manipulables. Pour chacune : matériel, protocole, puis résultats et interprétation dévoilés au moment choisi.</p><p class="meta">Lycée qualifiant Abdesslam Ammer, Salé. Pr. EL Hassouni Mohamed. Année scolaire 2026-2027.</p></section>
 <div class="units">${['1','2','3'].map(u=>`<section class="unit" style="--uc:${UN[u][1]}"><h2>Unité ${u}</h2><p class="un">${UN[u][0]}</p>${Object.keys(CH).filter(k=>k[0]==u).map(k=>`<h3>${CH[k]}</h3><ul>${EXP.filter(e=>e.ch==k).map(e=>`<li><i class="dot${e.sim?'':' st'}"></i><a href="#${e.id}">${e.t}</a></li>`).join('')}</ul>`).join('')}</section>`).join('')}</div>
 <section class="how"><h2>Utilisation en classe</h2><p>Activez « Grand écran » pour la projection. Présentez le protocole, laissez les élèves formuler leurs hypothèses, manipulez la simulation, puis dévoilez les résultats et l'interprétation.</p><p>Les flèches gauche et droite du clavier passent d'une expérience à l'autre. Cercle plein : simulation interactive. Cercle vide : étude de documents.</p></section>`;
 document.title='Laboratoire virtuel SVT, 1re Bac Sciences expérimentales';drawNav();window.scrollTo(0,0)}
const side=$('#side'),scrim=$('#scrim');
function closeSide(){side.classList.remove('open');scrim.hidden=true;$('#menu').setAttribute('aria-expanded','false')}
function route(){const id=decodeURIComponent(location.hash.slice(1)),i=EXP.findIndex(e=>e.id==id);closeSide();i<0?home():show(i)}
addEventListener('hashchange',route);
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)location.hash=EXP[+b.dataset.i].id});
$('#q').addEventListener('input',drawNav);
$('#main').addEventListener('click',e=>{const b=e.target.closest('.rv');if(!b)return;const o=b.getAttribute('aria-expanded')!='true';b.setAttribute('aria-expanded',o);b.nextElementSibling.hidden=!o});
$('#home').addEventListener('click',()=>{if(location.hash&&location.hash!='#')location.hash='';else home()});
$('#menu').addEventListener('click',()=>{const o=!side.classList.contains('open');side.classList.toggle('open',o);scrim.hidden=!o;$('#menu').setAttribute('aria-expanded',o)});
scrim.addEventListener('click',closeSide);
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}}};
function setBig(on){html.classList.toggle('big',on);$('#big').setAttribute('aria-pressed',on);store.set('svt-big',on?'1':'0')}
$('#big').addEventListener('click',()=>setBig(!html.classList.contains('big')));
const isDark=()=>html.dataset.theme?html.dataset.theme=='dark':matchMedia('(prefers-color-scheme: dark)').matches;
const themeLabel=()=>{$('#theme').textContent=isDark()?'Thème clair':'Thème sombre'};
$('#theme').addEventListener('click',()=>{html.dataset.theme=isDark()?'light':'dark';store.set('svt-theme',html.dataset.theme);themeLabel()});
const sv=store.get('svt-theme');if(sv)html.dataset.theme=sv;themeLabel();if(store.get('svt-big')=='1')setBig(true);
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,select,textarea')||e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.key=='ArrowRight'&&cur<EXP.length-1)location.hash=EXP[cur+1].id;else if(e.key=='ArrowLeft'&&cur>0)location.hash=EXP[cur-1].id;else if(e.key=='Escape')closeSide()});
route();
</script>
</body>
</html>
